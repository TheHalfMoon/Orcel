# cargo-deny configuration for the orcel-contain workspace only (XP-13).
# CI runs `cargo deny check licenses bans sources`. Every crate in the
# resolved graph (all targets) must carry a license on this list, come from
# crates.io or a path in this repository, and appear once.
[licenses]
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
