# cargo-audit configuration for the orcel-native-host workspace only (XP-05).
# Every ignore names its reason; anything new fails the CI job.
[advisories]
ignore = [
  # quick-xml 0.39.4: quadratic duplicate-attribute check and unbounded
  # NsReader namespace allocation, fixed in 0.41. No compatible upgrade exists:
  # the newest wayland-scanner (0.31.10) and zbus_xml (5.1.1) both require
  # ^0.39. It is reached two ways:
  # - wayland-scanner, a proc-macro. It parses the protocol XML shipped in
  #   wayland-protocols and vendored in platform-linux, at compile time.
  # - zbus_xml via zbus-lockstep, which atspi-common uses to check D-Bus
  #   signatures against the interface XML it bundles.
  # Neither path parses XML from a peer or the user. D-Bus traffic is binary,
  # not XML. The XP-05 binary calls no platform code at all.
  # XP-06 must re-check this when the host first calls AT-SPI. Drop these
  # ignores once both crates accept quick-xml >= 0.41.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]
