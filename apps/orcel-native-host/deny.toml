# cargo-deny configuration for the orcel-native-host workspace only (XP-05).
# Founder decision of 2026-11-17 (docs/orcel/grants/2026-11-17-founder-
# attestation.md, owner-asserted): a licence type blocks nothing, so this file
# has no [licenses] policy and CI runs `cargo deny check bans sources`.
# Licences are reported, not judged (`cargo deny list`); the licences of this
# graph stay recorded in docs/research/DEPENDENCY_LICENSE_REVIEW.md.

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
