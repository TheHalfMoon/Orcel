# Orcel native host for macOS and Linux (XP-05 vendoring, XP-06 observation).
#
# This is its own Cargo workspace on purpose: it is NOT a member of the root
# workspace, so orceld's lockfile and dependency graph do not change. The
# vendored Cua Driver crates under third_party/ are pinned to
# trycua/cua@a802eaf26ca97616a6bf0de6a29729a9346fbb1f; see
# third_party/cua-driver/PATCHES.md and docs/orcel/cua_driver_provenance.json.
[workspace]
resolver = "2"
members = [
  ".",
  "third_party/cua-driver/crates/cua-driver-contract",
  "third_party/cua-driver/crates/cua-driver-core",
  "third_party/cua-driver/crates/platform-macos",
  "third_party/cua-driver/crates/platform-linux",
  "third_party/cua-driver/crates/cursor-overlay",
  "third_party/cua-driver/crates/cua-cursor-motion",
  "third_party/cua-driver/crates/pip-preview",
]

# P-01: the vendored manifests inherit these keys with `workspace = true`.
# Values are copied from libs/cua-driver/rust/Cargo.toml at the pin; only the
# entries the vendored crates use are listed.
[workspace.package]
version = "0.36.0"
edition = "2021"
authors = ["trycua"]
license = "MIT"
repository = "https://github.com/trycua/cua"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zune-core = "=0.5.1"
uniffi = "=0.31.0"
postcard = { version = "1", features = ["alloc"] }
sha2 = "0.10"
zstd = "0.13"
chacha20poly1305 = { version = "0.11", features = ["rand_core", "zeroize"] }
hkdf = "0.12"
zeroize = { version = "1", features = ["derive"] }
coset = "0.4.2"
ciborium = "0.2.2"
time = { version = "0.3", features = ["formatting", "parsing"] }
getrandom = "0.4"
fs2 = "0.4"
hmac = "0.12"

[package]
name = "orcel-native-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/TheHalfMoon/Orcel"
publish = false

# P-03: orcel-minimal compiles out Cua's MCP server, daemon, CDP browser
# engine, Computer History, recording, perception client and PiP preview.
# XP-06: the adapter builds typed inputs through cua-driver-contract and reads
# process identity through orcel-platform (XP-03), outside this workspace.
[dependencies]
cua-driver-core = { path = "third_party/cua-driver/crates/cua-driver-core", default-features = false, features = ["orcel-minimal"] }
cua-driver-contract = { path = "third_party/cua-driver/crates/cua-driver-contract" }
orcel-platform = { path = "../../crates/orcel-platform" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
platform-macos = { path = "third_party/cua-driver/crates/platform-macos", features = ["orcel-minimal"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
platform-linux = { path = "third_party/cua-driver/crates/platform-linux", features = ["orcel-minimal"] }
