# orcel-doc-parser: the confined document parser (WI-05).
#
# Its own Cargo workspace, like apps/orcel-contain: the PDF and Office
# parsers never enter orceld's lockfile, and orceld never links them. orceld
# runs this binary only through the contained tier (apps/orcel-contain): no
# network, read access to one staged input file, no writable root, no process
# creation, CPU, memory and output limits and a timeout. The contract (spec,
# bounds and the stdout frame) is crates/orcel-provider-process/src/document_parser.rs.
#
# src/pdf.rs and src/document.rs are COPY_ADAPT of Firecrawl's native
# converters (firecrawl/firecrawl@f84845c864b6e2af22791c18fcf89ac2a21f1434,
# apps/api/native/src/{pdf,document}.rs, AGPL-3.0, founder authorization
# docs/orcel/grants/2026-10-13-founder-source-authorization.md; transplant
# rows T-FC-06 and T-FC-07). Each file names its donor blob and lists
# Orcel's changes; the notice is docs/orcel/notices/firecrawl-AGPL-3.0.txt.
[workspace]
resolver = "2"
members = ["."]
# The vendored lopdf is a patched dependency, not a member (#391).
exclude = ["third_party"]

[package]
name = "orcel-doc-parser"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/TheHalfMoon/Orcel"
rust-version = "1.88"
publish = false
description = "Orcel's confined PDF and Office to Markdown converter"

[[bin]]
name = "orcel-doc-parser"
path = "src/main.rs"

[dependencies]
# The donor's converters, at the versions its Cargo.toml names. Both are MIT
# (firecrawl/pdf-inspector, firecrawl/anydoc). No default features: no OCR,
# no rendering, no model download.
pdf-inspector = { version = "=1.21.0", default-features = false }
anydoc = { version = "=0.2.2", default-features = false }
# Already in the graph through pdf-inspector; named for the pre-flight checks
# (encryption, active content, page count, nesting) and the thread pool size.
lopdf = { version = "=0.45.0", default-features = false }
rayon = "1.10"
# Already in the graph (pdf-inspector and anydoc log through it). The parser
# installs one logger that only watches pdf-inspector's input-changing paths
# (src/pdf.rs, `parity`); nothing is printed.
log = "0.4"
# The donor's header and footer pass (deflate only, as in the donor).
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
roxmltree = "=0.20.0"
# The spec, bounds and stdout frame shared with orceld (std only).
orcel-provider-process = { path = "../../crates/orcel-provider-process" }

# #391: lopdf 0.45.0, vendored with Orcel's patch queue
# (third_party/lopdf/PATCHES.md; provenance docs/orcel/lopdf_provenance.json,
# checked by scripts/check-vendored-lopdf.mjs). P-02 charges every stream
# decode in the process, pdf-inspector's included, to one decode budget that
# src/pdf.rs opens per document.
[patch.crates-io]
lopdf = { path = "third_party/lopdf" }

[dev-dependencies]
tempfile = "3"

# The helper and the kernel client each hash the whole contained executable
# with their own SHA-256 (#384). Unoptimized, that costs tens of seconds per
# contained run on a Linux debug build (DWARF makes the binary large), which
# pushed the Document parser job past its timeout. Optimize just this code.
[profile.dev.package.orcel-provider-process]
opt-level = 3

[profile.release]
panic = "abort"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
