# cargo-deny configuration for the orcel-doc-parser workspace only (WI-05).
# Founder decision of 2026-11-17 (docs/orcel/grants/2026-11-17-founder-
# attestation.md, owner-asserted): a licence type blocks nothing, so this file
# has no [licenses] policy and CI runs `cargo deny check bans sources`.
# Licences are reported, not judged (`cargo deny list`); the licences of this
# graph stay recorded in docs/research/DEPENDENCY_LICENSE_REVIEW.md.
# Every crate in the resolved graph (all targets) must come from crates.io or
# a path in this repository. Duplicate versions are warned about (see [bans]).

[bans]
# Duplicate versions are reported, not refused: the Windows graph builds two
# `syn` majors (proc-macros only, through chrono's windows-core and
# thiserror), which nothing in this workspace can unify.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
