# cargo-deny configuration for the orcel-doc-parser workspace only (WI-05).
# CI runs `cargo deny check licenses bans sources`. Every crate in the
# resolved graph (all targets) must carry a license on this list, come from
# crates.io or a path in this repository. Duplicate versions are warned
# about (see [bans]).
[licenses]
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  # Beyond MIT and Apache-2.0, both permissive:
  # - BSD-3-Clause: brotli-decompressor, alloc-no-stdlib and alloc-stdlib
  #   (lopdf's Brotli filter) and encoding_rs's lookup tables;
  # - Zlib: zlib-rs (lopdf's inflater).
  "BSD-3-Clause",
  "Zlib",
]

[bans]
# Duplicate versions are reported, not refused: the Windows graph builds two
# `syn` majors (proc-macros only, through chrono's windows-core and
# thiserror), which nothing in this workspace can unify.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
