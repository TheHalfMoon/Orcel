# cargo-audit configuration for the orcel-doc-parser workspace only (WI-05).
# Every ignore names its reason; anything new fails the CI job.
[advisories]
ignore = [
  # zip 8.6.0: `ZipArchive::extract` and `ZipStreamReader::extract` preserve
  # SUID/SGID bits, create links whose targets leave the destination, and
  # apply permissions through links. Fixed in zip 9.0.0, but anydoc (every
  # release up to 0.2.4) requires ^8.6. Not reachable here: the parser and
  # anydoc only read entries into memory (`by_index`, `by_name`) and never
  # call `extract`, and the parser runs with no writable root at all (the
  # contained tier's spec, document_parser.rs). Drop these when anydoc
  # accepts zip >= 9.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]
