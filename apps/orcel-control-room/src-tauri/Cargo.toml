# SG-000119 slice A2: the Orcel Control Room shell, a lean Tauri 2 window
# (no Vite, no Tauri CLI, no React, no plugin). Preparation packet:
# docs/orcel/implementation-readiness/prep/SG-000119.md.
#
# This is its own Cargo workspace on purpose, as apps/orcel-native-host is:
# it is NOT a member of the root workspace, so `cargo test --workspace`, the
# release payload and the root `cargo audit` never see the Tauri graph. Its
# own Cargo.lock pins every crate (crates.io only, with checksums) and its
# deny.toml denies other sources, wildcards and every tauri-plugin-* crate.
# Development builds only (founder decision 6): bundle.active is false and
# no workflow uploads anything built here.
[workspace]
resolver = "2"
members = ["."]

[package]
name = "orcel-control-room-shell"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/TheHalfMoon/Orcel"
publish = false
rust-version = "1.90"

[lib]
name = "orcel_control_room_shell"
path = "src/lib.rs"

[[bin]]
name = "orcel-control-room-shell"
path = "src/main.rs"

# The native Windows tests open the real window, so each scenario runs in its
# own process on the main thread (tauri's event loop); the test binary is its
# own driver. It needs the test-hooks feature, so a plain `cargo test` skips
# it; CI runs it with `--features test-hooks --test native_shell`.
[[test]]
name = "native_shell"
path = "tests/native_shell.rs"
harness = false
required-features = ["test-hooks"]

# test-hooks compiles the native tests' callbacks (after the settings are
# applied, after the window is shown) into the library. Never a default:
# without it the Hooks struct has no field and no call site exists, so the
# shipped binary cannot carry a hook.
[features]
default = []
test-hooks = []

# SG-000119 A3: the shell against a live orceld (opt-in, see the file). It
# uses the after-show hook, so it needs test-hooks too:
# `SG119_LIVE_ORCELD=<orceld.exe> cargo test --features test-hooks --test native_live`.
[[test]]
name = "native_live"
path = "tests/native_live.rs"
harness = false
required-features = ["test-hooks"]

# Exact pins (founder decision 3). tauri's default features are off; only the
# wry runtime and custom-protocol (embedded assets) are on. Off: compression,
# dynamic-acl, common-controls-v6, tray-icon, image-png, image-ico, devtools,
# macos-private-api and test. orcel-app-api-client is Orcel's own path crate
# (slice A1): A2 uses its user SID for the single-instance mutex name; A3's
# five commands read orceld through it. serde_json (the root lock's
# =1.0.151, already the shell's dev-dependency in A2, so the lock is
# unchanged) builds the commands' typed refusals and channel messages.
[dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "custom-protocol"] }
orcel-app-api-client = { path = "../../../crates/orcel-app-api-client" }
serde_json = "=1.0.151"

# webview2-com and windows-core are exactly the versions tauri already
# resolves (no extra download): the WebView2 settings, their readback and the
# Rust-side web message counter. windows-sys 0.52.0 is the version
# orcel-app-api-client uses: the single-instance mutex and its DACL.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
windows-sys = { version = "=0.52.0", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "=2.7.4", default-features = false }

# SG-000119 A3: the ACL tests run the real ACL through tauri's test runtime
# (`tauri::test`), so tauri's `test` feature is on for test builds ONLY: the
# same exact version, and that feature adds no crate (`test = []` in 2.12.5),
# so the lock is unchanged. CI's `cargo tree -e normal -e features -i tauri`
# shows it absent from the normal build.
[dev-dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "custom-protocol", "test"] }

# The native test walks the shell's process tree to count every visible
# window it (or the WebView2 browser under it) owns. Same crate and version.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.52.0", features = ["Win32_System_Diagnostics_ToolHelp"] }
