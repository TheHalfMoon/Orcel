# Orcel approval dialog helper for Linux (XP-10).
#
# This is its own Cargo workspace on purpose, like apps/orcel-native-host:
# it is NOT a member of the root workspace, so orceld's lockfile and
# dependency graph do not change and building the root workspace never
# needs the GTK development files. orceld spawns the built binary from a
# pinned location (next to orceld, else /usr/libexec/orcel/); packaging is
# XP-17's.
[workspace]

[package]
name = "orcel-approval-helper-linux"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/TheHalfMoon/Orcel"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# gtk4-rs (MIT) needs GTK 4 at build time (libgtk-4-dev); only Linux links it.
[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = "0.11"

[profile.release]
panic = "abort"
