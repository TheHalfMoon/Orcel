# XP-17: deb and rpm packages of Orcel for Linux, built with nfpm (MIT,
# build tool only) by distribution/linux/package.sh, which also builds the
# per-user tarball. package.sh runs nfpm inside a staging directory that
# holds every `src` below, and sets ORCEL_VERSION and ORCEL_ARCH.
#
# The package installs read-only, root-owned files only: orceld, the
# orcel-contain helper with its pin (XP-13b), the XP-10 approval dialog
# helper and its polkit action (#369 item 6, #373 item 5), and two systemd
# *user* units. It has no maintainer scripts, nothing setuid or setgid, no
# system unit and no network listener.
#
# GTK 4 (the dialog) and polkit (pkcheck, for STRONG) are recommended, not
# required: a headless server runs orceld without them, and approvals there
# fail closed as unavailable, as they do without a graphical session. Nothing is enabled at
# install time; each user opts in with
# `systemctl --user enable --now orceld.socket`. All state stays in the
# user's private XDG state root (XP-01, mode 0700).

name: orcel
arch: ${ORCEL_ARCH}
platform: linux
version: ${ORCEL_VERSION}
release: "1"
section: utils
priority: optional
maintainer: Orcel project <https://github.com/TheHalfMoon/Orcel/issues>
description: |
  Orcel local agent runtime kernel (orceld).
  orceld is the policy and approval authority for local agent actions. It
  runs per user, started on demand by the orceld.socket systemd user unit.
vendor: Orcel
homepage: https://github.com/TheHalfMoon/Orcel
license: Apache-2.0

overrides:
  deb:
    recommends:
      - libgtk-4-1
      - polkitd | policykit-1
  rpm:
    recommends:
      - gtk4
      - polkit

contents:
  # Owned directories, so `dnf remove` and `apt remove` leave none behind.
  - dst: /usr/lib/orcel
    type: dir
    file_info:
      mode: 0755
      owner: root
      group: root
  - dst: /usr/share/doc/orcel
    type: dir
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: orceld
    dst: /usr/lib/orcel/orceld
    file_info:
      mode: 0755
      owner: root
      group: root
  # XP-13b: the contained-tier helper and its pin, beside orceld, which
  # resolves them only there.
  - src: orcel-contain
    dst: /usr/lib/orcel/orcel-contain
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: orcel-contain.sha256
    dst: /usr/lib/orcel/orcel-contain.sha256
    file_info:
      mode: 0644
      owner: root
      group: root
  # XP-10: the approval dialog helper, beside orceld, where orceld looks
  # first, and the polkit action STRONG approvals check.
  - src: orcel-approval-helper-linux
    dst: /usr/lib/orcel/orcel-approval-helper-linux
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: ai.orcel.approve.policy
    dst: /usr/share/polkit-1/actions/ai.orcel.approve.policy
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: orceld.socket
    dst: /usr/lib/systemd/user/orceld.socket
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: orceld@.service
    dst: /usr/lib/systemd/user/orceld@.service
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: LICENSE
    dst: /usr/share/doc/orcel/LICENSE
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: README.md
    dst: /usr/share/doc/orcel/README.md
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: THIRD_PARTY_NOTICES.txt
    dst: /usr/share/doc/orcel/THIRD_PARTY_NOTICES.txt
    file_info:
      mode: 0644
      owner: root
      group: root
