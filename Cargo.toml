[workspace]
resolver = "2"
members = [
  "crates/orcel-contracts",
  "crates/orcel-platform",
  "crates/orcel-policy",
  "crates/orcel-audit",
  "crates/orcel-journal",
  "crates/orcel-approval",
  "crates/orcel-provider-fs",
  "crates/orcel-provider-git",
  "crates/orcel-provider-process",
  "crates/orcel-provider-browser",
  "crates/orcel-provider-uia",
  "crates/orcel-provider-clipboard",
  "crates/orcel-provider-network",
  "crates/orcel-tunnel",
  "crates/orcel-browser-host",
  "crates/orcel-lifecycle",
  "crates/orceld",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/TheHalfMoon/Orcel"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs4 = "1.1"
