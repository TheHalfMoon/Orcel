name: Build, package, archive, and qualify a Orcel release
description: >-
  Builds the release binaries with deterministic flags and the MCP app from
  the locked dependency graph, packages a release directory (including
  third-party notices), writes a deterministic ZIP archive, extracts it, and
  runs the release-artifact qualification against the extracted archive.
  Shared by CI and the release workflow so both qualify exactly the same
  artifact. Requires checkout, the Rust toolchain, and Node.js first.

inputs:
  release-dir:
    description: Directory to write the packaged release into. The archive is written next to it as <release-dir>.zip.
    required: true

runs:
  using: composite
  steps:
    - name: Install locked npm dependencies
      shell: pwsh
      run: npm ci --ignore-scripts
    - name: Build the MCP app
      shell: pwsh
      run: npm run build
    - name: Set deterministic release build flags
      shell: pwsh
      run: |
        $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME ".cargo" }
        "RUSTFLAGS=-C link-arg=/Brepro --remap-path-prefix=$env:GITHUB_WORKSPACE=C:\orcel --remap-path-prefix=$cargoHome=C:\cargo" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    - name: Build the shipped release binaries
      shell: pwsh
      # Binaries only: building examples in the same invocation would unify
      # dev-dependency features (including test-only approval support) into
      # the shipped binaries.
      run: cargo build --release --locked -p orceld -p orcel-lifecycle --bins
    - name: Build the contained-tier helper (its own workspace)
      shell: pwsh
      working-directory: apps/orcel-contain
      # XP-13b: shipped beside orceld.exe; the probe fixture is not built.
      run: cargo build --release --locked --bin orcel-contain
    - name: Build the tunnel test fixture separately
      shell: pwsh
      run: cargo build --release --locked -p orcel-lifecycle --example fake_tunnel_client
    - name: Package release
      shell: pwsh
      run: node scripts/package-release.mjs --out "${{ inputs.release-dir }}"
    - name: Write the deterministic archive
      shell: pwsh
      run: node scripts/archive-release.mjs --release "${{ inputs.release-dir }}" --out "${{ inputs.release-dir }}.zip"
    - name: Extract the archive for qualification
      shell: pwsh
      run: Expand-Archive -Path "${{ inputs.release-dir }}.zip" -DestinationPath "${{ inputs.release-dir }}-from-archive"
    # F4 preliminary gate only: measures the bytes of this exact extracted
    # archive, NOT Node.js, the installed browser, filesystem allocation or
    # the absent desktop UI. Full installed-size evidence remains open.
    - name: Measure release payload against 400 MB budget
      shell: pwsh
      run: |
        node --test scripts/release-size.test.mjs
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $report = Join-Path $env:RUNNER_TEMP "orcel-release-size.json"
        node scripts/release-size.mjs --release "${{ inputs.release-dir }}-from-archive" --out $report
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $size = Get-Content $report -Raw | ConvertFrom-Json
        Add-Content $env:GITHUB_STEP_SUMMARY ("Orcel extracted payload: {0:N0} / {1:N0} bytes (scope: {2}; excludes external Node/browser prerequisites)." -f $size.payload_bytes, $size.byte_budget, $size.scope)
    - name: Qualify the release extracted from the archive
      shell: pwsh
      env:
        ORCEL_RELEASE_DIR: ${{ inputs.release-dir }}-from-archive
      run: cargo test --release --locked -p orcel-lifecycle --test release_qualification -- --ignored --nocapture
