name: Review Gates

on:
  pull_request_target:

permissions:
  contents: read

concurrency:
  group: review-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ocr-delegation:
    name: Alibaba OCR Delegation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OCR_BIN: /tmp/orcel-ocr
      OCR_OUT: /tmp/orcel-ocr-output
      OCR_URL: https://github.com/alibaba/open-code-review/releases/download/v1.12.9/opencodereview-linux-amd64
      OCR_SHA256: 9105c7081b8362a1cb0167f1ddfd1437e147a0e3c9a5af89c03c8859a5b0f0e8
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install checksum-pinned OpenCodeReview before candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$OCR_URL" --output "$OCR_BIN"
          echo "$OCR_SHA256  $OCR_BIN" | sha256sum --check --status
          chmod 700 "$OCR_BIN"
          mkdir -m 700 "$OCR_OUT"
          "$OCR_BIN" --version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Generate deterministic delegation spec
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" = "$BASE_SHA"
          "$OCR_BIN" delegate preview --format json --from "$BASE_SHA" --to "$HEAD_SHA" | tee "$OCR_OUT/ocr-preview.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          with open(os.environ["OCR_OUT"] + "/ocr-preview.json", encoding="utf-8") as handle:
              preview = json.load(handle)
          if preview.get("from") != base or preview.get("to") != head or preview.get("merge_base") != base:
              raise SystemExit("OCR preview does not match the exact PR range")
          files = []
          for entry in preview.get("reviewable_files", []):
              path = entry.get("path") if isinstance(entry, dict) else entry
              if not isinstance(path, str) or not path or path.startswith("-") or "\x00" in path:
                  raise SystemExit("OCR returned an invalid reviewable path")
              files.append(path)
          rules = {"groups": []}
          if files:
              completed = subprocess.run(
                  [os.environ["OCR_BIN"], "delegate", "rule", "--format", "json", "--", *files],
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
              )
              rules = json.loads(completed.stdout)
          encoded = json.dumps(rules, sort_keys=True, separators=(",", ":")).encode()
          evidence = {
              "schema_version": "1",
              "tool": "@alibaba-group/open-code-review@1.12.9",
              "base_sha": base,
              "head_sha": head,
              "total_files": preview.get("total_files"),
              "reviewable_count": preview.get("reviewable_count"),
              "excluded_count": preview.get("excluded_count"),
              "reviewable_files": files,
              "rule_groups": len(rules.get("groups", [])),
              "rules_sha256": hashlib.sha256(encoded).hexdigest(),
          }
          with open(os.environ["OCR_OUT"] + "/ocr-evidence.json", "w", encoding="utf-8") as handle:
              json.dump(evidence, handle, indent=2, sort_keys=True)
              handle.write("\n")
          with open(os.environ["OCR_OUT"] + "/ocr-rules.json", "w", encoding="utf-8") as handle:
              json.dump(rules, handle)
          print(f"OCR exact-range evidence: {evidence['reviewable_count']} reviewable, {evidence['excluded_count']} excluded")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ocr-delegation-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/orcel-ocr-output/ocr-preview.json
            /tmp/orcel-ocr-output/ocr-rules.json
            /tmp/orcel-ocr-output/ocr-evidence.json
          if-no-files-found: error
          retention-days: 14

  jev-review:
    name: Jev Semantic Review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      JEV_REVIEW_SHA: 31f89602797fb7bea007f8a480bf368bf564954e
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      # A failing step, not a job-level `if`: a skipped job would pass the required check.
      # pull_request_target runs for forks, and this job's credential isn't for them.
      - name: Refuse a pull request from a fork
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::Jev review doesn't run for a pull request from a fork; it stays unqualified."
            exit 1
          fi
      - name: Require TypeSafe credential
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TYPESAFE_API_KEY:-}" ]; then
            echo "::error::TYPESAFE_API_KEY is not configured for Orcel GitHub Actions; Jev review is UNPROVEN."
            exit 1
          fi
      - name: Fetch exact PR head as data
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          git cat-file -e "$HEAD_SHA^{commit}"
          test "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" = "$BASE_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          git status --short
      - name: Install pinned Jev Review
        shell: bash
        run: |
          set -euo pipefail
          JEV_DIR="$RUNNER_TEMP/jev-review"
          git clone https://github.com/devagrawal09/jev-review.git "$JEV_DIR"
          git -C "$JEV_DIR" checkout --detach "$JEV_REVIEW_SHA"
          npm --prefix "$JEV_DIR" ci --ignore-scripts
      - name: Verify base-controlled exact-diff Jev adapter
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git cat-file -e "$BASE_SHA:.github/scripts/jev-exact-diff.mjs"
          node --check .github/scripts/jev-exact-diff.mjs
      - name: Run genuine Jev exact-diff review
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          JEV_DIR="$RUNNER_TEMP/jev-review"
          BASE_ADAPTER="$RUNNER_TEMP/orcel-jev-exact-diff.mjs"
          git show "$BASE_SHA:.github/scripts/jev-exact-diff.mjs" > "$BASE_ADAPTER"
          node "$BASE_ADAPTER" "$BASE_SHA" "$HEAD_SHA" "$GITHUB_WORKSPACE" "$JEV_DIR" | tee jev-review.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: jev-review-${{ github.event.pull_request.head.sha }}
          path: jev-review.json
          if-no-files-found: warn
          retention-days: 14
