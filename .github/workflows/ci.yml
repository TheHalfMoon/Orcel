name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Manual only: the doc-parser-fuzz job (#389). Not a required check; the
  # other jobs also run on a dispatch, which is harmless.
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Seconds the document parser mutation fuzz runs (doc-parser-fuzz)"
        default: "600"
        required: false
      fuzz_seed:
        description: "Non-zero seed for the mutation sequence (doc-parser-fuzz)"
        default: "2654435769"
        required: false

permissions:
  contents: read

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # XP-08 (follow-up from the #348 judge): the Rust adapter's /2
      # negotiation test against the freshly built Go host, not a script. The
      # native-host job does the same with orcel-native-host on macOS and
      # Linux. The grep fails the step if the filter matched no test.
      - name: Adapter /2 handshake against the live Go host (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/orcel-host/orcel-computer-host.exe"
          (cd apps/orcel-computer-host && go build -trimpath -o "$bin" .)
          ORCEL_COMPUTER_HOST_BIN="$bin" cargo test -p orcel-provider-uia --lib -- --exact \
            computer_host::tests::configured_host_handshake_is_exact --nocapture 2>&1 | tee "$RUNNER_TEMP/handshake.log"
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/handshake.log"
      # XP-13b: the Linux Safe tier's cgroup path. Under a unit with
      # Delegate=yes the provider's unix tests must put the child in its own
      # cgroup (they fail instead of skipping when ORCEL_REQUIRE_SAFE_CGROUP
      # is set), so a grandchild that leaves the process group is killed too.
      - name: Safe tier under a delegated cgroup (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          test_bin=$(cargo test -p orcel-provider-process --lib --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .executable != null and (.package_id | contains("orcel-provider-process")) and .target.kind == ["lib"]) | .executable')
          test -x "$test_bin"
          sudo systemd-run --uid="$(id -u)" --gid="$(id -g)" -p Delegate=yes --pipe --wait --collect \
            -p WorkingDirectory="$PWD" -E TMPDIR=/tmp -E ORCEL_REQUIRE_SAFE_CGROUP=1 \
            "$test_bin" unix:: --test-threads=4
      # XP-15: the live clipboard tests (roundtrip, SG-000064, and the
      # ownership-loss test, which takes no filter) must run for real off
      # Windows; they fail instead of skipping when
      # ORCEL_REQUIRE_LIVE_CLIPBOARD is set.
      - name: Live clipboard roundtrip (Linux, Xvfb)
        if: runner.os == 'Linux'
        env:
          ORCEL_REQUIRE_LIVE_CLIPBOARD: "1"
        run: xvfb-run -a cargo test -p orcel-provider-clipboard -- xp15_ sg000064_ --test-threads=1
      - name: Live clipboard roundtrip (macOS)
        if: runner.os == 'macOS'
        env:
          ORCEL_REQUIRE_LIVE_CLIPBOARD: "1"
        run: cargo test -p orcel-provider-clipboard -- xp15_ sg000064_ --test-threads=1
      # XP-09: the real macOS SOFT dialog and LocalAuthentication verifier,
      # through the real broker, must fail closed with nobody to answer.
      # xp09_macos_headless_paths_fail_closed fails instead of skipping when
      # ORCEL_REQUIRE_XP09_HEADLESS is set. The donor's two bypass variables
      # are set and must change no outcome (S-24), in debug and release.
      - name: macOS approvals fail closed headless (debug and release)
        if: runner.os == 'macOS'
        env:
          ORCEL_REQUIRE_XP09_HEADLESS: "1"
          ORCEL_REQUIRE_XP09_BYPASS_ENV: "1"
          CUA_ENV_SKIP_SENSITIVE_AUTH: "1"
          CUA_ENV_ALLOW_UNVERIFIED_SENSITIVE_EXPORT: "1"
        run: |
          cargo test -p orcel-approval -- xp09_ --nocapture
          cargo test -p orcel-approval --release -- xp09_ --nocapture
      # XP-10: the real Linux SOFT helper path and polkit verifier, through
      # the real broker, must fail closed on a runner (no logind graphical
      # session). xp10_linux_headless_paths_fail_closed fails instead of
      # skipping when ORCEL_REQUIRE_XP10_HEADLESS is set; the donor's two
      # bypass variables are set and must change no outcome (S-24).
      - name: Linux approvals fail closed headless (debug and release)
        if: runner.os == 'Linux'
        env:
          ORCEL_REQUIRE_XP10_HEADLESS: "1"
          ORCEL_REQUIRE_XP10_BYPASS_ENV: "1"
          CUA_ENV_SKIP_SENSITIVE_AUTH: "1"
          CUA_ENV_ALLOW_UNVERIFIED_SENSITIVE_EXPORT: "1"
        run: |
          cargo test -p orcel-approval -- xp10_ --nocapture
          cargo test -p orcel-approval --release -- xp10_ --nocapture

      # CR-01: real other-user evidence for the app API socket. `nobody`
      # (passwordless sudo on the hosted runners) must be refused with
      # EACCES at the private directory. The test fails instead of skipping
      # when ORCEL_APP_API_OTHER_USER_TEST is set.
      - name: App API socket refuses another user (Linux, macOS)
        if: runner.os != 'Windows'
        env:
          ORCEL_APP_API_OTHER_USER_TEST: "1"
        run: cargo test -p orceld -- --exact app_api::tests::cr01_other_user_cannot_reach_the_socket --nocapture

      # XP-19: the real per-OS secret store. The tests fail instead of
      # skipping when ORCEL_REQUIRE_XP19_KEYRING is set. Windows uses DPAPI
      # for the runner account; macOS a temporary keychain this step creates,
      # makes the user default and deletes; Linux a headless gnome-keyring
      # under its own dbus-run-session. The Linux no-keyring leg points the
      # session bus nowhere: the store must be unavailable and write nothing
      # (S-23: never a plaintext fallback).
      - name: Secret store round trip (Windows DPAPI)
        if: runner.os == 'Windows'
        env:
          ORCEL_REQUIRE_XP19_KEYRING: "1"
        run: cargo test -p orceld -- xp19_ --nocapture
      - name: Secret store round trip (macOS temporary keychain)
        if: runner.os == 'macOS'
        env:
          ORCEL_REQUIRE_XP19_KEYRING: "1"
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/orcel-xp19.keychain-db"
          original="$(security default-keychain -d user | xargs)"
          searched="$(security list-keychains -d user | xargs)"
          restore() {
            security default-keychain -d user -s "$original" || true
            security list-keychains -d user -s $searched || true
            security delete-keychain "$keychain" || true
          }
          trap restore EXIT
          security create-keychain -p orcel-xp19-ci "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p orcel-xp19-ci "$keychain"
          security list-keychains -d user -s "$keychain" $searched
          security default-keychain -d user -s "$keychain"
          cargo test -p orceld -- xp19_ --nocapture
      - name: Secret store round trip (Linux gnome-keyring) and no-keyring refusal
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus-daemon dbus-x11
          dbus-run-session -- bash -c '
            set -euo pipefail
            printf %s orcel-xp19-ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            ORCEL_REQUIRE_XP19_KEYRING=1 cargo test -p orceld -- xp19_ --nocapture
          '
          env -u XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS=unix:path=/nonexistent/orcel-xp19             ORCEL_XP19_EXPECT_NO_KEYRING=1 cargo test -p orceld -- xp19_ --nocapture

  # XP-05: the macOS/Linux native host is its own Cargo workspace with the
  # vendored Cua Driver crates (apps/orcel-native-host/third_party/cua-driver).
  # XP-06: it serves read-only observation over orcel-computer-host/2; orceld
  # reaches it through ORCEL_COMPUTER_HOST_BIN.
  native-host:
    name: Native host / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: apps/orcel-native-host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # The packages Cua's own Linux CI installs for platform-linux's default
        # features (D-Bus, X11/XInput/XTest/Xext, xcb, Wayland, xkbcommon).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libxkbcommon-dev libx11-dev libxi-dev \
            libxtst-dev libxext-dev libxcb1-dev libwayland-dev
      - name: Build (release, locked)
        run: cargo build --locked --release -p orcel-native-host
      - name: The binary prints its protocol version
        run: test "$(./target/release/orcel-native-host --version)" = "orcel-computer-host/2"
      - name: Reachability (no script engine, CDP client, server, daemon or browser code)
        # XP-06 links the platform crates through the adapter, so these checks
        # now cover real code. The words run_script and remote-debugging are
        # no longer a usable signal: linked core code names them in its
        # authorization and capability tables and in launch_guard.rs, the
        # refusal that blocks launching an app with --remote-debugging-port.
        # What must be absent is the QuickJS engine and every CDP client, so
        # the binary may hold neither QuickJS nor the CDP-only protocol
        # literals, nor any rquickjs or script_tool symbol. The registry test
        # registry_holds_the_allowlist_and_no_compiled_out_tool checks that
        # run_script, page, kill_app and the browser tools are not registered.
        # P-03 keeps a few named items in otherwise compiled-out modules
        # (PATCHES.md): server.rs's observation vocabulary, browser::types and
        # download, BrowserJs::supports, ElectronJs::is_electron and
        # execute_main, and Linux is_chromium_identity. Only those may appear;
        # any other symbol of those modules fails.
        run: |
          set -euo pipefail
          bin=target/release/orcel-native-host
          if grep -a -q -e QuickJS -e webSocketDebuggerUrl -e Runtime.evaluate -e /json/version "$bin"; then
            echo "::error::the native host binary holds the script engine or a CDP client"
            exit 1
          fi
          symbols=$(nm -C "$bin" 2>/dev/null || true)
          test -n "$symbols"
          if grep -E 'rquickjs|cua_driver_core::script_tool' <<<"$symbols"; then
            echo "::error::the native host binary links the run_script engine"
            exit 1
          fi
          compiled_out='cua_driver_core::(server|daemon|browser|cdp|history|recording|perception_client)::|platform_(macos|linux)::(browser|browser_platform|history|recording_hooks|video_[a-z]+|pip)::'
          retained='cua_driver_core::server::(ToolOperation|tool_operation|is_computer_action|ToolCompletionObservation|DurationBucket|OutputType|OutputSizeBucket|ToolErrorClass|ToolRefusalCode)|cua_driver_core::browser::(types|download)::|platform_macos::browser::(browser_js::BrowserJs>?::supports|electron_js::ElectronJs>?::(is_electron|execute_main))|platform_linux::browser_platform::is_chromium_identity'
          # nm -C prints inherent methods as <Type>::method, hence the optional >.
          hits=$(grep -E "$compiled_out" <<<"$symbols" | grep -vE "$retained" || true)
          if [ -n "$hits" ]; then
            head -n 40 <<<"$hits"
            echo "::error::the native host binary links a compiled-out Cua module"
            exit 1
          fi
      - name: Feature graph excludes run_script (QuickJS) and Rego
        run: |
          set -euo pipefail
          tree=$(cargo tree --locked -p orcel-native-host -e normal --prefix none)
          if grep -E '^(rquickjs|rquickjs-core|rquickjs-sys|regorus) ' <<<"$tree"; then
            echo "::error::a disabled cua-driver-core default feature reached the graph"
            exit 1
          fi
      - name: Record binary size and package count
        run: |
          set -euo pipefail
          bytes=$(wc -c < target/release/orcel-native-host | tr -d ' ')
          packages=$(cargo tree --locked -p orcel-native-host -e normal --prefix none | sed 's/ (\*)$//' | sort -u | wc -l | tr -d ' ')
          locked=$(grep -c '^name = ' Cargo.lock)
          {
            echo "### orcel-native-host on ${{ runner.os }}"
            echo "- release binary: ${bytes} bytes"
            echo "- packages in the normal build graph for this OS: ${packages}"
            echo "- packages in Cargo.lock (all targets and features): ${locked}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: cua-driver-core lib tests (no default features)
        # Upstream's code with orcel-minimal off. The fifteen skipped tests load
        # a YAML capability manifest, which upstream compiles to an error
        # without its default `yaml` feature, on every OS (PATCHES.md, P-03).
        run: |
          cargo test --locked -p cua-driver-core --no-default-features --lib -- --exact \
            --skip authorization::tests::standard_manifest_scope_is_checked_before_existing_profile_approval \
            --skip batch_tools::tests::a_manifest_that_allows_run_actions_allows_run_steps \
            --skip batch_tools::tests::each_step_is_held_to_the_capability_manifest \
            --skip batch_tools::tests::the_batch_itself_needs_the_manifest_to_allow_it \
            --skip consent::tests::capability_manifest_resources_narrow_standard_and_unrestricted_without_prompting \
            --skip session_authorization::tests::capability_manifest_is_optional_except_in_bounded_mode \
            --skip session_authorization::tests::capability_manifests_are_stored_per_connection_context \
            --skip tool::runtime_isolation_tests::background_input_rechecks_manifest_before_every_adapter_dispatch \
            --skip tool::runtime_isolation_tests::bounded_history_requires_the_matching_operation_resource \
            --skip tool::runtime_isolation_tests::bounded_observation_uses_only_the_manifest_without_a_protected_host \
            --skip tool::runtime_isolation_tests::capability_manifest_tools_narrow_standard_and_unrestricted \
            --skip tool::runtime_isolation_tests::capability_manifest_typed_resources_narrow_standard_and_unrestricted \
            --skip tool::runtime_isolation_tests::manifest_cannot_widen_standard_foreign_process_termination \
            --skip tool::runtime_isolation_tests::manifest_preserves_standard_owned_process_termination_inside_scope \
            --skip tool::runtime_isolation_tests::rejected_typed_resource_does_not_refresh_manifest_idle_lease
      - name: cursor-overlay and cua-cursor-motion tests (P-05 asset changes)
        # Exercises the re-encoded default theme and the font-less badge path.
        run: cargo test --locked -p cursor-overlay -p cua-cursor-motion --features cua-cursor-motion/serde
      - name: orcel-native-host tests (unit and stdio protocol conformance)
        # XP-06: the protocol, supervisor, worker, adapter and mapping unit
        # tests, then the real binary over stdio. Without a session (Linux:
        # no display or bus; macOS: no TCC grant on the runner) observation
        # must be unavailable with a reason, never prompted for.
        run: cargo test --locked --release -p orcel-native-host -- --nocapture
      - name: Install a Linux GUI session for live observation (Xvfb, Openbox, AT-SPI, GTK3)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends             xvfb openbox at-spi2-core dbus-x11 python3-gi gir1.2-gtk-3.0 python3-tk xdotool
      - name: Live observation under Xvfb and AT-SPI (host frames and kernel registry)
        if: runner.os == 'Linux'
        # XP-06: a GTK3 probe with a password field and a protected Orcel
        # surface, observed through the real host (frame log must never hold
        # the secret) and through orcel-provider-uia's registry end to end.
        # XP-07: a GTK3 capture probe captured exactly (marker colour, 320x200
        # client area), its protected surface refused, a covered and a
        # minimized window refused, through the host and the registry.
        # XP-11: the same probe refuses every action on its password field and
        # on its Orcel approval window, keeps pixel-addressed frames denied,
        # and takes one real value write and press; through the registry, an
        # action reaches the host only under an approval armed on its exact
        # target, and one approval is one action.
        # XP-12: raw input to a Tk probe that journals what it receives (Cua
        # refuses background pointer input to GTK without a uinput pointer,
        # which Xvfb cannot have), through the real host (window-relative
        # landing, the refusals, the covered and protected windows, a stale
        # and a human-moved input tick) and through the adapter under an
        # armed approval. Keyboard delivery needs Cua's uinput virtual master
        # keyboard, which Xvfb cannot have: the hello says so and those cells
        # are typed skips.
        # Every test fails instead of skipping when its variable is set.
        env:
          ORCEL_XP06_LIVE: "1"
          ORCEL_XP07_LIVE: deliver
          ORCEL_XP11_LIVE: "1"
          ORCEL_XP12_LIVE: deliver
        run: |
          set -euo pipefail
          export ORCEL_COMPUTER_HOST_BIN="$PWD/target/release/orcel-native-host"
          dbus-run-session -- bash -euo pipefail -c '
            Xvfb :99 -screen 0 1280x800x24 -nolisten tcp >/dev/null 2>&1 &
            export DISPLAY=:99
            sleep 2
            openbox >/dev/null 2>&1 &
            sleep 1
            cargo test --locked --release -p orcel-native-host --test live_observation -- --nocapture
            cargo test --locked --release -p orcel-native-host --test live_capture -- --nocapture
            cargo test --locked --release -p orcel-native-host --test live_actions -- --nocapture
            cargo test --locked --release -p orcel-native-host --test live_input -- --nocapture
            cd ../..
            cargo test --locked -p orcel-provider-uia --test xp06_native_host_live -- --nocapture
            cargo test --locked -p orcel-provider-uia --test xp07_native_capture_live -- --nocapture
            cargo test --locked -p orcel-provider-uia --test xp11_native_actions_live -- --nocapture
            cargo test --locked -p orcel-provider-uia --test xp12_native_input_live -- --nocapture
          '
      - name: Capture availability on the macOS runner (XP-07, report mode)
        if: runner.os == 'macOS'
        # The host captures only with Screen Recording granted and replayd's
        # direct-capture consent already recorded for the app macOS holds
        # responsible for it; it never raises either prompt. The runner's
        # responsible process is not an app bundle, so capture is expected
        # to be unavailable with permission_missing here, and the test checks
        # that refusal. Where it is delivered, the full AppKit check runs.
        env:
          ORCEL_XP07_LIVE: report
        run: cargo test --locked --release -p orcel-native-host --test live_capture -- --nocapture
      - name: Raw input on the hosted macOS session (XP-12)
        if: runner.os == 'macOS'
        # An AppKit probe, compiled with swiftc, journals what it receives.
        # Cua's macOS pixel tools measure a window's scale from a capture, so
        # input needs the direct-capture consent the hosted runner lacks (the
        # XP-07 `report` mode): the five operations must say unavailable with
        # `permission_missing`, a frame is refused with that code and the
        # probe receives nothing, and the host never prompts. Where the
        # consent is recorded the full delivery check runs instead (manual,
        # SECURITY_INTEGRATION.md).
        env:
          ORCEL_XP12_LIVE: report
        run: cargo test --locked --release -p orcel-native-host --test live_input -- --nocapture
      # XP-08: the shared native conformance suite. The harness apps are Cua's
      # MIT fixtures (tests/native-fixtures, T-CUA-07), built from source on
      # the runner: GTK3 runs as PyGObject source, AppKit and WKWebView are
      # compiled with swiftc, and Electron comes from the pinned lockfile.
      # The spec's .github/workflows/native-e2e.yml is not added, because the
      # governed workflow set is exactly four files
      # (release_blocker_sweep::workflow_set_is_exactly_the_governed_quartet).
      # The spec's self-hosted macOS runner waits for FD-05, so the macOS leg
      # runs on the hosted runner, which grants the host Accessibility and
      # Screen Recording. ORCEL_XP08_FIXTURES makes both suites run and fail
      # rather than skip.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Install the XP-08 Linux session tools (Sway, xprop, xdotool, Electron runtime libraries)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends \
            sway x11-utils xdotool libglib2.0-bin libnss3 libgbm1 libasound2t64
      - name: Stage the XP-08 harness apps from tests/native-fixtures
        run: |
          set -euo pipefail
          SECONDS=0
          bash ../../tests/native-fixtures/orcel-stage.sh "$RUNNER_TEMP/orcel-fixtures"
          echo "- XP-08 harness staging on ${{ runner.os }}: ${SECONDS}s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: XP-08 conformance under Xvfb and Openbox (X11)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export ORCEL_XP08_FIXTURES="$RUNNER_TEMP/orcel-fixtures" ORCEL_XP08_REPORT_DIR="$RUNNER_TEMP/xp08-reports"
          SECONDS=0
          dbus-run-session -- bash -euo pipefail -c '
            Xvfb :98 -screen 0 1280x1024x24 -nolisten tcp >/dev/null 2>&1 &
            export DISPLAY=:98
            sleep 2
            openbox >/dev/null 2>&1 &
            sleep 1
            # Chromium exposes its web tree on AT-SPI only when the bus says
            # accessibility is on (Cua sets the same in its Linux runners).
            gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus \
              --method org.freedesktop.DBus.Properties.Set org.a11y.Status IsEnabled "<true>"
            cargo test --locked --release -p orcel-native-host \
              --test conformance_native --test conformance_shared_web -- --nocapture --test-threads=1
          '
          echo "- XP-08 suite on Linux X11: ${SECONDS}s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: XP-08 conformance under headless Sway (Wayland)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export ORCEL_XP08_FIXTURES="$RUNNER_TEMP/orcel-fixtures" ORCEL_XP08_REPORT_DIR="$RUNNER_TEMP/xp08-reports"
          XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          export XDG_RUNTIME_DIR
          # The upstream Wayland runner's headless Sway settings
          # (scripts/ci/linux/run-rust-e2e-wayland.sh at the pin).
          printf '%s\n' 'xwayland disable' 'output HEADLESS-1 mode 1920x1080' \
            'focus_follows_mouse no' 'for_window [title="^CuaTestHarness"] floating enable' > "$XDG_RUNTIME_DIR/sway.conf"
          SECONDS=0
          env -u DISPLAY dbus-run-session -- bash -euo pipefail -c '
            export WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_RENDERER_ALLOW_SOFTWARE=1
            export WLR_LIBINPUT_NO_DEVICES=1 WLR_HEADLESS_OUTPUTS=1
            sway --unsupported-gpu --config "$XDG_RUNTIME_DIR/sway.conf" >"$RUNNER_TEMP/sway.log" 2>&1 &
            for _ in $(seq 1 50); do
              SWAYSOCK="$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -type s -name "sway-ipc.*.sock" -print -quit)"
              display="$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -type s -name "wayland-*" -printf "%f\n" -quit)"
              [ -n "$SWAYSOCK" ] && [ -n "$display" ] && break
              sleep 0.2
            done
            test -n "$SWAYSOCK" || { cat "$RUNNER_TEMP/sway.log"; exit 1; }
            export SWAYSOCK WAYLAND_DISPLAY="$display"
            export XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=sway XDG_SESSION_DESKTOP=sway
            swaymsg -t get_version
            gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus \
              --method org.freedesktop.DBus.Properties.Set org.a11y.Status IsEnabled "<true>"
            cargo test --locked --release -p orcel-native-host \
              --test conformance_native --test conformance_shared_web -- --nocapture --test-threads=1
          '
          echo "- XP-08 suite on Linux Sway: ${SECONDS}s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: XP-08 conformance on the hosted macOS session (Quartz)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          export ORCEL_XP08_FIXTURES="$RUNNER_TEMP/orcel-fixtures" ORCEL_XP08_REPORT_DIR="$RUNNER_TEMP/xp08-reports"
          SECONDS=0
          cargo test --locked --release -p orcel-native-host \
            --test conformance_native --test conformance_shared_web -- --nocapture --test-threads=1
          echo "- XP-08 suite on macOS: ${SECONDS}s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the XP-08 reports against orcel-benchmark-report/1
        # Linux: shared web and native, each for X11 and Sway. macOS: both
        # suites for Quartz.
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/xp08-reports"
          expected=$([ "$RUNNER_OS" = Linux ] && echo 4 || echo 2)
          test "$(find "$dir" -name '*.report.json' | wc -l | tr -d ' ')" = "$expected"
          node ../../scripts/check-benchmark-report.mjs "$dir"
          node -e '
            const fs = require("fs"), path = require("path"), dir = process.argv[1];
            for (const file of fs.readdirSync(dir).sort()) {
              const report = JSON.parse(fs.readFileSync(path.join(dir, file), "utf8"));
              const count = (status) => report.rows.filter((row) => row.status === status).length;
              console.log(`- ${file}: ${count("pass")} pass, ${count("skip")} skip (typed skips: foreground rungs, refused by policy, no geometry, unavailable on Wayland, or not built), ${count("fail")} fail, ${count("error")} error`);
            }
          ' "$dir" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xp08-native-conformance-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/xp08-reports
          if-no-files-found: error
      - name: Adapter /2 handshake against the live native host
        # XP-08 (follow-up from the #348 judge): the Rust adapter negotiates
        # /2 with the binary this job built. The grep fails the step if the
        # filter matched no test.
        working-directory: .
        run: |
          set -euo pipefail
          ORCEL_COMPUTER_HOST_BIN="$PWD/apps/orcel-native-host/target/release/orcel-native-host" \
            cargo test -p orcel-provider-uia --lib -- --exact \
            computer_host::tests::configured_native_host_handshake_is_exact --nocapture 2>&1 | tee "$RUNNER_TEMP/handshake.log"
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/handshake.log"
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: runner.os == 'Linux'
        id: native-host-tools-cache
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: native-host-tools-audit-0.22.2-deny-0.20.2-${{ runner.os }}
      - name: Install cargo-audit and cargo-deny
        if: runner.os == 'Linux' && steps.native-host-tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-deny --locked --version 0.20.2
      - name: Audit the native-host lockfile
        if: runner.os == 'Linux'
        # Ignores, each with its reason: apps/orcel-native-host/.cargo/audit.toml.
        run: cargo audit
      - name: License check of the native-host graph
        if: runner.os == 'Linux'
        run: cargo deny check licenses

  # XP-13: the contained tier's one-shot helper is its own Cargo workspace
  # (tokio stays out of the kernel lockfile, AD-16). Its end-to-end tests run
  # the real helper, pinned by SHA-256 through the kernel-side client, on every
  # OS: Landlock + seccomp on Linux, Seatbelt (sandbox-exec) on macOS,
  # AppContainer + Job Object on Windows. They fail rather than skip when a
  # boundary is missing.
  contain:
    name: Contained tier / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: apps/orcel-contain
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - name: Kernel facilities (Linux)
        if: runner.os == 'Linux'
        run: |
          uname -r
          cat /sys/kernel/security/lsm || true
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and end-to-end tests
        run: cargo test --locked -- --nocapture
      # XP-13b: orceld wiring. A registered executable that opted in to the
      # contained tier runs through process.spawn under the helper the step
      # above built; the test fails instead of skipping when
      # ORCEL_REQUIRE_CONTAINED_WIRING is set.
      - name: orceld runs a contained-tier registered executable (end to end)
        env:
          ORCEL_REQUIRE_CONTAINED_WIRING: "1"
        run: |
          set -euo pipefail
          dir=$(pwd -W 2>/dev/null || pwd)/target/debug
          ORCEL_TEST_CONTAIN_DIR="$dir" cargo test --locked --manifest-path ../../Cargo.toml -p orceld -- xp13b_ --nocapture
      # Issue #369, item 1: orceld@.service sets RestrictNamespaces=yes and
      # every child inherits it. orcel-contain needs no namespace (Landlock and
      # seccomp only), so the unit is unchanged. This runs the end-to-end
      # suite as a transient system unit carrying the unit file's own sandbox
      # directives, read from the file, to prove it.
      - name: End-to-end tests under the orceld@.service sandbox directives
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          unit=../../distribution/linux/orceld@.service
          grep -qx 'RestrictNamespaces=yes' "$unit"
          args=()
          while read -r line; do args+=(-p "$line"); done < <(grep -E '^(NoNewPrivileges|RestrictSUIDSGID|RestrictAddressFamilies|RestrictNamespaces|RestrictRealtime|LockPersonality|SystemCallArchitectures)=' "$unit")
          test "${#args[@]}" -eq 14
          test_bin=$(cargo test --locked --test contain --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "contain" and .executable != null) | .executable')
          test -x "$test_bin"
          sudo systemd-run --uid="$(id -u)" --gid="$(id -g)" --pipe --wait --collect \
            -p WorkingDirectory="$PWD" -E TMPDIR=/tmp "${args[@]}" \
            "$test_bin" --test-threads=1
      - name: Release build of the helper
        run: |
          set -euo pipefail
          cargo build --locked --release --bin orcel-contain
          bin=target/release/orcel-contain
          test -f "$bin" || bin="$bin.exe"
          bytes=$(wc -c < "$bin" | tr -d ' ')
          locked=$(grep -c '^name = ' Cargo.lock)
          {
            echo "### orcel-contain on ${{ runner.os }}"
            echo "- release binary: ${bytes} bytes"
            echo "- packages in Cargo.lock (all targets and features): ${locked}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: runner.os == 'Linux'
        id: contain-tools-cache
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: native-host-tools-audit-0.22.2-deny-0.20.2-${{ runner.os }}
      - name: Install cargo-audit and cargo-deny
        if: runner.os == 'Linux' && steps.contain-tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-deny --locked --version 0.20.2
      - name: Audit the orcel-contain lockfile
        if: runner.os == 'Linux'
        run: cargo audit
      - name: License, ban and source check of the orcel-contain graph
        if: runner.os == 'Linux'
        run: cargo deny check licenses bans sources

  # WI-05: the confined document parser is its own Cargo workspace (the PDF
  # and Office parsers never enter orceld's lockfile). Its end-to-end tests
  # run the real parser under the real orcel-contain helper on every OS,
  # through the one spec orceld builds, and fail instead of skipping when the
  # helper is missing (ORCEL_REQUIRE_CONTAINED_PARSER).
  doc-parser:
    name: Document parser / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: apps/orcel-doc-parser
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build the orcel-contain helper and its probe (its own workspace)
        run: cargo build --locked --manifest-path ../orcel-contain/Cargo.toml --bins
      - name: Unit and contained end-to-end tests
        env:
          ORCEL_REQUIRE_CONTAINED_PARSER: "1"
          # A longer mutation run on Linux, where a contained run is cheapest
          # to repeat; the other legs keep the default.
          ORCEL_WI05_FUZZ_CASES: ${{ runner.os == 'Linux' && '60' || '12' }}
        run: |
          set -euo pipefail
          contain=$(cd ../orcel-contain/target/debug && (pwd -W 2>/dev/null || pwd))
          ORCEL_TEST_CONTAIN_DIR="$contain" cargo test --locked -- --nocapture
      - name: orceld parses a committed download under the contained tier (end to end)
        env:
          ORCEL_REQUIRE_CONTAINED_PARSER: "1"
        run: |
          set -euo pipefail
          contain=$(cd ../orcel-contain/target/debug && (pwd -W 2>/dev/null || pwd))
          parser=$(cd target/debug && (pwd -W 2>/dev/null || pwd))
          ORCEL_TEST_CONTAIN_DIR="$contain" ORCEL_TEST_DOC_PARSER_DIR="$parser"             cargo test --locked --manifest-path ../../Cargo.toml -p orceld -- wi05_ --nocapture
      - name: Release build of the parser
        run: |
          set -euo pipefail
          cargo build --locked --release --bin orcel-doc-parser
          bin=target/release/orcel-doc-parser
          test -f "$bin" || bin="$bin.exe"
          bytes=$(wc -c < "$bin" | tr -d ' ')
          locked=$(grep -c '^name = ' Cargo.lock)
          {
            echo "### orcel-doc-parser on ${{ runner.os }}"
            echo "- release binary: ${bytes} bytes"
            echo "- packages in Cargo.lock (all targets and features): ${locked}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: runner.os == 'Linux'
        id: doc-parser-tools-cache
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: native-host-tools-audit-0.22.2-deny-0.20.2-${{ runner.os }}
      - name: Install cargo-audit and cargo-deny
        if: runner.os == 'Linux' && steps.doc-parser-tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-deny --locked --version 0.20.2
      - name: Audit the orcel-doc-parser lockfile
        if: runner.os == 'Linux'
        # Ignores, each with its reason: apps/orcel-doc-parser/.cargo/audit.toml.
        run: cargo audit
      - name: License, ban and source check of the orcel-doc-parser graph
        if: runner.os == 'Linux'
        run: cargo deny check licenses bans sources

  # #389: the WI-05 acceptance item "fuzz 10 minutes without a crash escaping
  # the process", run on demand. A time-boxed mutation run of a wider fixture
  # corpus through the real parser under the real contained tier
  # (tests/contained.rs, wi05_mutated_inputs_never_escape_the_contained_process).
  # A crash, ceiling or timeout is contained and counted; its input is kept
  # as a build artifact for replay. A crash that escaped the contained
  # process, or a malformed frame, fails the job. Dispatch with:
  #   gh workflow run CI --ref <branch> -f fuzz_seconds=600
  doc-parser-fuzz:
    name: Document parser fuzz (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: apps/orcel-doc-parser
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Build the orcel-contain helper and its probe (its own workspace)
        run: cargo build --locked --manifest-path ../orcel-contain/Cargo.toml --bins
      - name: Mutation fuzz under containment
        env:
          ORCEL_REQUIRE_CONTAINED_PARSER: "1"
          ORCEL_WI05_FUZZ_SECONDS: ${{ inputs.fuzz_seconds }}
          ORCEL_WI05_FUZZ_SEED: ${{ inputs.fuzz_seed }}
          ORCEL_WI05_FUZZ_CRASH_DIR: ${{ runner.temp }}/doc-parser-fuzz-crashes
        run: |
          set -euo pipefail
          contain=$(cd ../orcel-contain/target/debug && pwd)
          ORCEL_TEST_CONTAIN_DIR="$contain" cargo test --locked --test contained wi05_mutated -- --nocapture 2>&1 | tee "$RUNNER_TEMP/fuzz.log"
          {
            echo "### Document parser fuzz"
            grep 'wi05 mutation run' "$RUNNER_TEMP/fuzz.log" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: doc-parser-fuzz-crashes
          path: ${{ runner.temp }}/doc-parser-fuzz-crashes
          if-no-files-found: ignore

  # XP-10: the GTK4 approval dialog orceld spawns on Linux. Its own Cargo
  # workspace, so the root build never needs the GTK development files.
  approval-helper-linux:
    name: Approval helper / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: apps/orcel-approval-helper-linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Install GTK 4 and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev xvfb xauth
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Protocol tests
        run: cargo test --locked
      - name: Build (release, locked)
        run: cargo build --locked --release
      # The real helper under Xvfb: nobody answers, so its own 2 s timeout
      # must answer deny with orceld's nonce; without a display it must exit
      # without an answer. ORCEL_REQUIRE_XP10_HELPER makes a skip a failure.
      - name: Real helper under Xvfb answers deny on timeout
        working-directory: .
        timeout-minutes: 15
        env:
          ORCEL_REQUIRE_XP10_HELPER: "1"
        run: |
          export ORCEL_XP10_HELPER_BINARY="$PWD/apps/orcel-approval-helper-linux/target/release/orcel-approval-helper-linux"
          timeout 600 xvfb-run -a cargo test -p orcel-approval -- xp10_real_helper --nocapture --test-threads=1
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: approval-helper-tools-cache
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: native-host-tools-audit-0.22.2-deny-0.20.2-${{ runner.os }}
      - name: Install cargo-audit and cargo-deny
        if: steps.approval-helper-tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-deny --locked --version 0.20.2
      - name: Audit the helper lockfile
        run: cargo audit
      - name: License check of the helper graph
        run: cargo deny check licenses

  node:
    name: Node / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Install
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  # CR-02: the headless Control Room client against the real orceld app API
  # (CR-01) on each OS. ORCEL_REQUIRE_LIVE_ORCELD makes the contract and
  # conformance tests fail instead of skipping without the daemon;
  # ORCEL_APP_API_OTHER_USER_TEST runs the connect as `nobody` (passwordless
  # sudo on the hosted Linux and macOS runners).
  control-room:
    name: Control Room client / ${{ matrix.os }}
    # A daemon that never listens fails its test within 30 s; this bounds
    # the job however a test misbehaves (the first macOS run hung 6 h).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Build orceld
        run: cargo build --locked -p orceld
      - name: Install
        run: npm ci --prefix apps/orcel-control-room --ignore-scripts
      - name: Typecheck
        run: npm --prefix apps/orcel-control-room run typecheck
      - name: Test against the real orceld
        env:
          ORCEL_REQUIRE_LIVE_ORCELD: "1"
          ORCEL_APP_API_OTHER_USER_TEST: ${{ runner.os != 'Windows' && '1' || '' }}
        run: npm --prefix apps/orcel-control-room test

  web:
    name: Web / ubuntu-latest
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Install isolated web dependencies
        run: npm ci --prefix apps/web --ignore-scripts
      - name: Audit isolated web dependencies
        run: npm audit --prefix apps/web
      - name: Build Orcel brand media from reviewed SVG sources
        run: |
          node scripts/sync-brand.mjs --check
          node scripts/render-brand.mjs
          python3 scripts/export-brand.py
      - name: Typecheck
        run: npm run web:typecheck
      - name: Test
        run: npm run web:test
      - name: Production build
        run: npm run web:build

  release-qualification:
    name: Release qualification / windows-latest
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - uses: ./.github/actions/build-package-qualify
        with:
          release-dir: ${{ runner.temp }}/orcel-release
      - uses: ./.github/actions/reproducibility-check
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          release-dir: ${{ runner.temp }}/orcel-release
          out-dir: ${{ runner.temp }}/dist
      - name: Generate SBOM and provenance
        shell: pwsh
        run: |
          $release = Join-Path $env:RUNNER_TEMP "orcel-release"
          $out = Join-Path $env:RUNNER_TEMP "dist"
          $version = (Get-Content (Join-Path $release "manifest.json") | ConvertFrom-Json).version
          $name = "orcel-$version-windows-x64"
          Copy-Item "$release.zip" (Join-Path $out "$name.zip")
          Copy-Item (Join-Path $release "manifest.json") (Join-Path $out "$name.manifest.json")
          Copy-Item (Join-Path $release "THIRD_PARTY_NOTICES.txt") (Join-Path $out "THIRD_PARTY_NOTICES.txt")
          node scripts/generate-sbom.mjs --release $release --out (Join-Path $out "$name.cdx.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/provenance.mjs --release $release --artifact (Join-Path $out "$name.zip") --sbom (Join-Path $out "$name.cdx.json") --reproducibility (Join-Path $out "reproducibility.json") --out (Join-Path $out "$name.provenance.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # LF line endings, so the standard `sha256sum -c` verifies the file.
          $sums = Get-ChildItem $out -File | Where-Object Name -ne "SHA256SUMS.txt" | Sort-Object Name | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          [System.IO.File]::WriteAllText((Join-Path $out "SHA256SUMS.txt"), (($sums -join "`n") + "`n"), [System.Text.Encoding]::ASCII)
          Get-Content (Join-Path $out "SHA256SUMS.txt")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orcel-release-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 30

  relay-container:
    name: Relay container / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the pinned self-host relay image
        run: docker build -f apps/orcel-relay/Dockerfile -t orcel-relay:ci .
      - name: Run the relay from a validated configuration and probe it
        run: |
          mkdir -p "$RUNNER_TEMP/relay-config" "$RUNNER_TEMP/relay-state"
          chmod 0777 "$RUNNER_TEMP/relay-state"
          cat > "$RUNNER_TEMP/relay-config/relay.json" <<'JSON'
          {"publicOrigin":"http://127.0.0.1:8787","listenHost":"0.0.0.0","listenPort":8787,"stateDir":"/var/lib/orcel-relay","allowedOrigins":[]}
          JSON
          docker run -d --name relay -p 127.0.0.1:8787:8787 \
            -v "$RUNNER_TEMP/relay-config:/etc/orcel-relay:ro" \
            -v "$RUNNER_TEMP/relay-state:/var/lib/orcel-relay" orcel-relay:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/healthz | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8787/.well-known/oauth-protected-resource/mcp | grep -q '"resource":"http://127.0.0.1:8787/mcp"'
          curl -fsS http://127.0.0.1:8787/.well-known/oauth-authorization-server | grep -q '"code_challenge_methods_supported":\["S256"\]'
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8787/mcp -H 'content-type: application/json' -d '{}')
          test "$status" = "401"
          test -f "$RUNNER_TEMP/relay-state/relay-state.json"
          if docker logs relay 2>&1 | grep -E 'Bearer|access_token|refresh_token|privateKey'; then exit 1; fi
          docker rm -f relay

  # XP-17: builds the Linux deb, rpm and tarball with nfpm, checks their
  # contents and modes, installs the deb and the tarball for the runner user
  # and talks to orceld through the systemd user socket, and installs the
  # rpm in Fedora 41. Not a release gate: release.yml is unchanged for
  # Windows.
  linux-packages:
    name: Linux packages / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DIST: ${{ github.workspace }}/../linux-dist
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Build orceld (release, locked)
        run: cargo build --release --locked -p orceld
      - name: Build the orcel-contain helper (release, locked, its own workspace)
        run: cargo build --release --locked --manifest-path apps/orcel-contain/Cargo.toml --bin orcel-contain
      - name: Install the pinned nfpm (checksum-verified)
        run: |
          bash distribution/linux/install-nfpm.sh "$RUNNER_TEMP/nfpm-bin"
          echo "$RUNNER_TEMP/nfpm-bin" >> "$GITHUB_PATH"
      - name: Build the deb, rpm and tarball
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          bash distribution/linux/package.sh "$version" target/release/orceld apps/orcel-contain/target/release/orcel-contain "$DIST"
          ls -l "$DIST"
      - name: Package file list and modes (dpkg -c), no maintainer scripts
        run: |
          deb="$DIST/orcel_${VERSION}-1_amd64.deb"
          dpkg -c "$deb"
          actual=$(dpkg -c "$deb" | awk '$1 !~ /^d/ { print $1, $2, $6 }' | sort)
          expected=$(sort <<'LIST'
          -rwxr-xr-x root/root ./usr/lib/orcel/orceld
          -rwxr-xr-x root/root ./usr/lib/orcel/orcel-contain
          -rw-r--r-- root/root ./usr/lib/orcel/orcel-contain.sha256
          -rw-r--r-- root/root ./usr/lib/systemd/user/orceld.socket
          -rw-r--r-- root/root ./usr/lib/systemd/user/orceld@.service
          -rw-r--r-- root/root ./usr/share/doc/orcel/LICENSE
          -rw-r--r-- root/root ./usr/share/doc/orcel/README.md
          -rw-r--r-- root/root ./usr/share/doc/orcel/THIRD_PARTY_NOTICES.txt
          LIST
          )
          expected=$(echo "$expected" | sed 's/^ *//' | sort)
          diff <(echo "$expected") <(echo "$actual")
          # No setuid, setgid or sticky bit on any entry, directories included.
          if dpkg -c "$deb" | awk '{ print $1 }' | grep -E '[sStT]'; then exit 1; fi
          control=$(dpkg-deb --ctrl-tarfile "$deb" | tar -t)
          echo "$control"
          if echo "$control" | grep -E 'preinst|postinst|prerm|postrm|config|triggers'; then exit 1; fi
          tar -tvzf "$DIST/orcel-${VERSION}-linux-x86_64.tar.gz"
          (cd "$DIST" && sha256sum --check --strict SHA256SUMS-linux.txt)
      - name: A tampered download fails its checksum
        run: |
          mkdir "$RUNNER_TEMP/tampered" && cp "$DIST"/* "$RUNNER_TEMP/tampered/"
          tarball="$RUNNER_TEMP/tampered/orcel-${VERSION}-linux-x86_64.tar.gz"
          # Flip every bit of one byte inside the archive.
          python3 -c 'import sys; p = sys.argv[1]; b = bytearray(open(p, "rb").read()); b[100] ^= 0xFF; open(p, "wb").write(b)' "$tarball"
          if (cd "$RUNNER_TEMP/tampered" && sha256sum --check --strict SHA256SUMS-linux.txt); then
            echo "a tampered tarball passed its checksum" >&2
            exit 1
          fi
      - name: Install the deb and start the runner's systemd user manager
        run: |
          sudo apt-get install -y "$DIST/orcel_${VERSION}-1_amd64.deb"
          dpkg -L orcel
          test -z "$(dpkg --verify orcel)"
          # XP-13b: the installed pin names the installed helper.
          test "$(cat /usr/lib/orcel/orcel-contain.sha256)" = "$(sha256sum /usr/lib/orcel/orcel-contain | cut -d ' ' -f 1)"
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            state=$(XDG_RUNTIME_DIR=/run/user/$uid systemctl --user is-system-running 2>/dev/null || true)
            echo "user manager: $state"
            case "$state" in running|degraded) break ;; esac
            sleep 1
          done
          XDG_RUNTIME_DIR=/run/user/$uid systemctl --user --version
      - name: systemd-analyze verify --user on the installed units
        run: |
          mkdir -p "$RUNNER_TEMP/units"
          cp /usr/lib/systemd/user/orceld.socket "$RUNNER_TEMP/units/"
          cp /usr/lib/systemd/user/orceld@.service "$RUNNER_TEMP/units/orceld@probe.service"
          systemd-analyze verify --user "$RUNNER_TEMP/units/orceld.socket" "$RUNNER_TEMP/units/orceld@probe.service"
      - name: orceld answers through the user socket
        run: |
          mkdir -p "$HOME/orcel-ci-workspace" "$HOME/.config/orcel"
          chmod 0700 "$HOME/.config/orcel"
          printf '%s\n' "ORCEL_WORKSPACES_JSON='[{\"id\":\"ci\",\"root\":\"$HOME/orcel-ci-workspace\"}]'" > "$HOME/.config/orcel/orceld.env"
          systemctl --user daemon-reload
          systemctl --user enable --now orceld.socket
          systemctl --user status orceld.socket --no-pager
          sock="$XDG_RUNTIME_DIR/orcel/orceld.sock"
          test "$(stat -c '%a %U' "$sock")" = "600 $USER"
          test "$(stat -c '%a %U' "$XDG_RUNTIME_DIR/orcel")" = "700 $USER"
          python3 scripts/linux-orceld-probe.py socket "$sock" ci
          python3 scripts/linux-orceld-probe.py socket "$sock" ci
          test "$(stat -c '%a %U' "$HOME/.local/state/orcel")" = "700 $USER"
          ls -la "$HOME/.local/state/orcel"
          journalctl --user --no-pager -u 'orceld@*' | tail -n 20
          # No process of the instance outlives its connection.
          sleep 1
          if systemctl --user list-units --no-legend 'orceld@*' | grep -E 'running|activating'; then exit 1; fi
          # No TCP or UDP listener was opened.
          if ss -ltnup | grep -i orceld; then exit 1; fi
      - name: Probe namespace-based hardening in a user unit (recorded, not enforced)
        run: |
          dropin="$HOME/.config/systemd/user/orceld@.service.d"
          mkdir -p "$dropin"
          printf '[Service]\nProtectSystem=strict\nReadWritePaths=%%h\nPrivateTmp=yes\n' > "$dropin/probe.conf"
          systemctl --user daemon-reload
          if python3 scripts/linux-orceld-probe.py socket "$XDG_RUNTIME_DIR/orcel/orceld.sock" ci; then
            echo "PROBE: orceld works with ProtectSystem=strict and PrivateTmp=yes in a user unit"
          else
            echo "PROBE: orceld fails with ProtectSystem=strict and PrivateTmp=yes in a user unit"
          fi
          journalctl --user --no-pager -u 'orceld@*' | tail -n 20
          rm -rf "$dropin"
          systemctl --user daemon-reload
      - name: A modified installed file is reported, and uninstall removes the payload
        run: |
          python3 scripts/linux-orceld-probe.py socket "$XDG_RUNTIME_DIR/orcel/orceld.sock" ci
          echo tampered | sudo tee -a /usr/lib/orcel/orceld > /dev/null
          verify=$(dpkg --verify orcel || true)
          echo "$verify"
          echo "$verify" | grep -F /usr/lib/orcel/orceld
          systemctl --user disable --now orceld.socket
          sudo apt-get remove -y orcel
          test ! -e /usr/lib/orcel
          test ! -e /usr/share/doc/orcel
          test ! -e /usr/lib/systemd/user/orceld.socket
          # User state is kept.
          test -d "$HOME/.local/state/orcel"
      - name: Per-user tarball install answers through the user socket
        run: |
          mkdir -p "$HOME/.local/share/orcel" "$HOME/.config/systemd/user"
          tar -xzf "$DIST/orcel-${VERSION}-linux-x86_64.tar.gz" --strip-components=1 -C "$HOME/.local/share/orcel"
          install -m 0644 "$HOME/.local/share/orcel/systemd/orceld.socket" "$HOME/.local/share/orcel/systemd/orceld@.service" "$HOME/.config/systemd/user/"
          cp "$HOME/.config/systemd/user/orceld@.service" "$RUNNER_TEMP/units/orceld@tarball.service"
          systemd-analyze verify --user "$HOME/.config/systemd/user/orceld.socket" "$RUNNER_TEMP/units/orceld@tarball.service"
          systemctl --user daemon-reload
          systemctl --user enable --now orceld.socket
          python3 scripts/linux-orceld-probe.py socket "$XDG_RUNTIME_DIR/orcel/orceld.sock" ci
          systemctl --user disable --now orceld.socket
      - name: Install the rpm in Fedora 41
        run: |
          docker run --rm -v "$DIST:/dist:ro" -v "$PWD/scripts:/probe:ro" \
            docker.io/library/fedora@sha256:f1a3fab47bcb3c3ddf3135d5ee7ba8b7b25f2e809a47440936212a3a50957f3d \
            bash -euxc '
              rpm=/dist/orcel-'"$VERSION"'-1.x86_64.rpm
              rpm -qplv "$rpm"
              test -z "$(rpm -qp --scripts "$rpm")"
              if rpm -qplv "$rpm" | awk "{ print \$1 }" | grep -E "[sStT]"; then exit 1; fi
              dnf install -y --setopt=install_weak_deps=False "$rpm" python3
              rpm -V orcel
              mkdir -p /root/ws
              ORCEL_WORKSPACES_JSON="[{\"id\":\"ci\",\"root\":\"/root/ws\"}]" python3 /probe/linux-orceld-probe.py exec /usr/lib/orcel/orceld ci
              dnf remove -y orcel
              test ! -e /usr/lib/orcel
              test ! -e /usr/share/doc/orcel
            '

  supply-chain:
    name: Supply chain audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Audit locked npm dependencies
        run: |
          npm ci --ignore-scripts
          npm audit
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: cargo-audit-cache
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}
      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit locked Rust dependencies
        run: cargo audit

  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Diff check
        run: git diff --check
      - name: Validate current Orcel identity
        run: node scripts/check-current-identity.mjs
      - name: Vendored Cua Driver crates match the upstream pin outside PATCHES.md
        # --upstream also reads each tree id from trycua/cua on GitHub, so the
        # ids recorded in this repository are not trusted on their own.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-vendored-cua.mjs --upstream
      - name: Vendored lopdf matches its crates.io release outside PATCHES.md
        # --upstream downloads the crate from crates.io and checks its
        # checksum and tree id, so the ids recorded here are not trusted alone.
        run: node scripts/check-vendored-lopdf.mjs --upstream
      - name: Validate SpecGrain JSON and canonical evidence
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          specs = sorted(Path(".specgrain/specs").glob("*.json"))
          assert specs, "no SpecGrain files"

          ledger_path = Path(".specgrain/canonical-evidence.json")
          assert ledger_path.is_file(), "missing canonical evidence ledger"
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          assert ledger.get("schema_version") == 1
          assert set(ledger.get("state_semantics", {})) == {"GRAIN", "PROVEN", "CLOSED"}
          evidence = ledger.get("grains", {})

          spec_ids = set()
          closed_ids = set()
          sha40 = re.compile(r"^[0-9a-f]{40}$")
          run_id = re.compile(r"^[0-9]+$")

          for path in specs:
              data = json.loads(path.read_text(encoding="utf-8"))
              grain_id = data["id"]
              assert grain_id.startswith("SG-")
              assert grain_id not in spec_ids, f"duplicate SpecGrain id: {grain_id}"
              spec_ids.add(grain_id)
              assert data["state"] in {"GRAIN", "PROVEN", "CLOSED"}
              assert data.get("acceptance")

              if data["state"] == "CLOSED":
                  closed_ids.add(grain_id)
                  item = evidence.get(grain_id)
                  assert item, f"CLOSED grain lacks canonical evidence: {grain_id}"
                  assert isinstance(item.get("implementation_pr"), int) and item["implementation_pr"] > 0
                  assert sha40.fullmatch(item.get("qualified_head", "")), f"invalid qualified_head: {grain_id}"
                  assert sha40.fullmatch(item.get("merge_sha", "")), f"invalid merge_sha: {grain_id}"
                  assert run_id.fullmatch(str(item.get("pre_merge_ci", ""))), f"invalid pre_merge_ci: {grain_id}"
                  assert run_id.fullmatch(str(item.get("post_merge_ci", ""))), f"invalid post_merge_ci: {grain_id}"
                  assert item.get("unresolved_review_threads") == 0, f"blocking review history recorded: {grain_id}"

          unknown = set(evidence) - spec_ids
          assert not unknown, f"canonical evidence refers to missing SpecGrain(s): {sorted(unknown)}"
          assert closed_ids == set(evidence), "ledger and CLOSED SpecGrain set must match exactly"

          current = Path("docs/canonical/CURRENT.md").read_text(encoding="utf-8")
          assert "Governance snapshot base:" in current
          assert "Canonical main:" not in current, "CURRENT must not self-reference its eventual merge SHA"
          assert "chore/sg-000009a-closeout" not in current, "stale closeout branch remains in CURRENT"

          print(f"validated {len(specs)} SpecGrain files and {len(evidence)} CLOSED evidence records")
