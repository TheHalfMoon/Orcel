name: Orcel identity migration

on:
  push:
    branches:
      - generated/eve-full-import-9c36b7c
    paths:
      - .orcel-migration/rename-from-kaf.mjs
      - .orcel-migration/audit-identity.mjs
      - .github/workflows/orcel-identity-migration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orcel-identity-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Apply Orcel identity migration once
        shell: bash
        run: |
          set -euo pipefail
          node .orcel-migration/rename-from-kaf.mjs
          git diff --check
          git diff --binary > "$RUNNER_TEMP/orcel-first-pass.diff"
          test -s "$RUNNER_TEMP/orcel-first-pass.diff"

      - name: Prove migration idempotency
        shell: bash
        run: |
          set -euo pipefail
          node .orcel-migration/rename-from-kaf.mjs
          git diff --check
          git diff --binary > "$RUNNER_TEMP/orcel-second-pass.diff"
          cmp "$RUNNER_TEMP/orcel-first-pass.diff" "$RUNNER_TEMP/orcel-second-pass.diff"

      - name: Audit identity and compatibility boundaries
        run: node .orcel-migration/audit-identity.mjs

      - name: Commit exact generated result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "refactor: finalize Orcel identity and compatibility contracts"
          echo "ORCEL_MIGRATION_HEAD=$(git rev-parse HEAD)"
          echo "ORCEL_MIGRATION_TREE=$(git rev-parse HEAD^{tree})"

      - name: Push normal fast-forward commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
