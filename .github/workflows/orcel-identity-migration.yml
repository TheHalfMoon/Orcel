# Exact-head Orcel identity migration and evidence capture.
name: Orcel identity migration

on:
  push:
    branches:
      - generated/eve-full-import-9c36b7c
    paths:
      - .orcel-migration/rename-from-orcel.mjs
      - .orcel-migration/audit-identity.mjs
      - .orcel-migration/repair-external-contracts.mjs
      - .github/workflows/orcel-identity-migration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orcel-identity-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Apply Orcel identity migration once
        shell: bash
        run: |
          set -euo pipefail
          node .orcel-migration/rename-from-orcel.mjs
          node .orcel-migration/repair-external-contracts.mjs
          git diff --check
          git diff --binary > "$RUNNER_TEMP/orcel-first-pass.diff"
          test -s "$RUNNER_TEMP/orcel-first-pass.diff"

      - name: Prove migration idempotency
        shell: bash
        run: |
          set -euo pipefail
          node .orcel-migration/rename-from-orcel.mjs
          node .orcel-migration/repair-external-contracts.mjs
          git diff --check
          git diff --binary > "$RUNNER_TEMP/orcel-second-pass.diff"
          cmp "$RUNNER_TEMP/orcel-first-pass.diff" "$RUNNER_TEMP/orcel-second-pass.diff"

      - name: Audit identity and compatibility boundaries
        shell: bash
        run: |
          set -euo pipefail
          node .orcel-migration/audit-identity.mjs
          node .orcel-migration/repair-external-contracts.mjs --check

      - name: Commit exact generated result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "refactor: finalize Orcel identity and compatibility contracts"
          git show --no-patch --format='HEAD=%H%nTREE=%T%nPARENT=%P' HEAD | tee "$RUNNER_TEMP/orcel-generated-metadata.txt"
          git format-patch -1 --stdout --binary > "$RUNNER_TEMP/orcel-generated.patch"
          test -s "$RUNNER_TEMP/orcel-generated.patch"

      - name: Upload exact generated patch before push
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orcel-generated-migration-${{ github.sha }}
          path: |
            ${{ runner.temp }}/orcel-generated.patch
            ${{ runner.temp }}/orcel-generated-metadata.txt
          if-no-files-found: error
          retention-days: 1

      - name: Push normal fast-forward commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
