name: Scoped package repair

on:
  push:
    branches:
      - fix/npm-scoped-core-package

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair duplicated scoped package references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import subprocess
          from pathlib import Path

          root = Path.cwd()
          tracked = [
              value
              for value in subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
              if value
          ]
          skip_prefixes = (
              ".github/",
              ".orcel-migration/",
              "research/",
          )
          text_suffixes = {
              ".cjs", ".css", ".cts", ".html", ".js", ".json", ".jsonc", ".jsx",
              ".md", ".mdx", ".mjs", ".mts", ".sh", ".svelte", ".ts", ".tsx",
              ".txt", ".vue", ".yaml", ".yml",
          }
          replacements = (
              ("@orcel/@orcel/orcel", "@orcel/orcel"),
              ("@orcel/orcel/orcel", "@orcel/orcel"),
          )

          changed = []
          for rel in tracked:
              if rel.endswith("CHANGELOG.md") or rel.startswith(skip_prefixes):
                  continue
              path = root / rel
              if path.suffix.lower() not in text_suffixes and path.name not in {"AGENTS.md", "Dockerfile", "README"}:
                  continue
              try:
                  source = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = source
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if rel == "README.md":
                  updated = updated.replace(
                      "https://img.shields.io/npm/v/orcel.svg",
                      "https://img.shields.io/npm/v/@orcel/orcel.svg",
                  )
                  updated = updated.replace(
                      "https://img.shields.io/npm/l/orcel.svg",
                      "https://img.shields.io/npm/l/@orcel/orcel.svg",
                  )
              if updated != source:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(rel)

          print(f"REPAIRED_FILES={len(changed)}")
          for rel in changed:
              print(rel)
          PY

      - name: Repair workflow package filters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_paths = [
              ".github/workflows/bundle-analysis.yml",
              ".github/workflows/e2e-local.yml",
              ".github/workflows/e2e-postgres.yml",
              ".github/workflows/e2e-vercel.yml",
          ]
          replacements = (
              ("pnpm --filter orcel run build", "pnpm --filter './packages/orcel' run build"),
              ("pnpm --filter orcel build", "pnpm --filter './packages/orcel' build"),
              ("pnpm --filter=orcel run build", "pnpm --filter './packages/orcel' run build"),
              ("pnpm --filter=orcel build", "pnpm --filter './packages/orcel' build"),
          )

          changed = []
          for rel in workflow_paths:
              path = Path(rel)
              source = path.read_text(encoding="utf-8")
              updated = source
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != source:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(rel)

          print(f"REPAIRED_WORKFLOW_FILTERS={len(changed)}")
          for rel in changed:
              print(rel)
          PY

      - name: Audit repaired scoped references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          tracked = [
              value
              for value in subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
              if value
          ]
          skip_prefixes = (".github/", ".orcel-migration/", "research/")
          failures = []
          for rel in tracked:
              if rel.endswith("CHANGELOG.md") or rel.startswith(skip_prefixes):
                  continue
              path = root / rel
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for token in ("@orcel/@orcel", "@orcel/orcel/orcel"):
                  if token in text:
                      failures.append(f"{rel}: malformed scoped token {token}")

          readme = (root / "README.md").read_text(encoding="utf-8")
          if 'from "@orcel/orcel/tools"' not in readme:
              failures.append("README.md: canonical scoped tools import is missing")
          if "img.shields.io/npm/v/orcel.svg" in readme or "img.shields.io/npm/l/orcel.svg" in readme:
              failures.append("README.md: legacy unscoped npm badge remains")

          for rel in (
              ".github/workflows/bundle-analysis.yml",
              ".github/workflows/e2e-local.yml",
              ".github/workflows/e2e-postgres.yml",
              ".github/workflows/e2e-vercel.yml",
          ):
              text = (root / rel).read_text(encoding="utf-8")
              if re.search(r"--filter(?:=|\s+)orcel(?:\s|$)", text):
                  failures.append(f"{rel}: legacy unscoped pnpm filter remains")

          if failures:
              raise SystemExit("\n".join(failures[:200]))
          print("SCOPED_REFERENCE_REPAIR_AUDIT=PASS")
          PY

      - name: Verify diff hygiene
        run: git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No repair changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: repair scoped workflow filters'
          git push origin HEAD:fix/npm-scoped-core-package
