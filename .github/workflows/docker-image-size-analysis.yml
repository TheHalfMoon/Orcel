name: Docker Image Size Analysis

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - packages/orcel/Dockerfile
      - packages/orcel/.dockerignore
      - .github/workflows/docker-image-size-analysis.yml
      - scripts/docker-image-size-budget.mjs
      - scripts/docker-image-size-report.mjs

concurrency:
  group: docker-image-size-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Prepare main baseline worktree
        id: baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASELINE_ROOT="$RUNNER_TEMP/orcel-docker-image-baseline"
          rm -rf "$BASELINE_ROOT"
          git worktree add --detach "$BASELINE_ROOT" "$BASE_SHA"
          echo "root=$BASELINE_ROOT" >> "$GITHUB_OUTPUT"

          dockerfile=""
          context=""
          if [[ -f "$BASELINE_ROOT/packages/orcel/Dockerfile" ]]; then
            dockerfile=packages/orcel/Dockerfile
            context=packages/orcel
          elif [[ -f "$BASELINE_ROOT/Dockerfile" ]]; then
            dockerfile=Dockerfile
            context=.
          elif [[ -d "$BASELINE_ROOT/packages" ]]; then
            dockerfile="$(cd "$BASELINE_ROOT" && find packages -mindepth 2 -maxdepth 2 -type f -name Dockerfile -print | sort | head -n 1)"
            if [[ -n "$dockerfile" ]]; then
              context="$(dirname "$dockerfile")"
            fi
          fi

          if [[ -n "$dockerfile" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
            echo "context=$context" >> "$GITHUB_OUTPUT"
            echo "label=main (${BASE_SHA:0:7})" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "label=main (${BASE_SHA:0:7}; no Docker baseline)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build main baseline Docker image
        id: baseline_image
        if: steps.baseline.outputs.available == 'true'
        working-directory: ${{ steps.baseline.outputs.root }}
        env:
          BASELINE_CONTEXT: ${{ steps.baseline.outputs.context }}
          BASELINE_DOCKERFILE: ${{ steps.baseline.outputs.dockerfile }}
        run: |
          set -euo pipefail
          docker buildx build \
            --cache-from type=gha,scope=orcel-docker-image-size \
            --file "$BASELINE_DOCKERFILE" \
            --load \
            --platform linux/amd64 \
            --tag orcel-docker-size:baseline \
            "$BASELINE_CONTEXT"

          size_bytes="$(docker image inspect orcel-docker-size:baseline --format '{{.Size}}')"
          echo "size_bytes=$size_bytes" >> "$GITHUB_OUTPUT"

      - name: Build current Docker image
        id: current_image
        run: |
          set -euo pipefail
          docker buildx build \
            --cache-from type=gha,scope=orcel-docker-image-size \
            --cache-to type=gha,mode=max,scope=orcel-docker-image-size \
            --file packages/orcel/Dockerfile \
            --load \
            --platform linux/amd64 \
            --tag orcel-docker-size:current \
            packages/orcel

          size_bytes="$(docker image inspect orcel-docker-size:current --format '{{.Size}}')"
          echo "size_bytes=$size_bytes" >> "$GITHUB_OUTPUT"

      - name: Verify sandbox user workspace and sudo permissions
        run: |
          docker run --rm orcel-docker-size:current bash -lc '
            set -euo pipefail
            test "$(id -un)" = vercel-sandbox
            test "$(stat -c %U /workspace)" = vercel-sandbox
            test "$(stat -c %U /usr/local/bin/node)" = root
            test "$(npm prefix -g)" = "$HOME/.local"
            test "$(pnpm bin -g)" = "$PNPM_HOME/bin"
            test -d "$HOME/.local/bin"
            git init --quiet /workspace
            git -C /workspace remote add origin https://github.com/TheHalfMoon/orcel.git
            sudo -n true
            # Backends run authored commands through a non-interactive `bash -lc`
            # login shell. Exiting it must be silent and preserve the exit status.
            test ! -e "$HOME/.bash_logout"
            test -z "$(bash -lc "exit 0" 2>&1)"
            bash -lc "set -euo pipefail; exit 0"
            bash -lc "exit 3" || test "$?" = 3
          '

      - name: Record initial-import baseline absence
        if: steps.baseline.outputs.available != 'true'
        env:
          CURRENT_SIZE_BYTES: ${{ steps.current_image.outputs.size_bytes }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo '## Docker Image Size Summary: `packages/orcel/Dockerfile`'
            echo
            echo '- Current Orcel Docker image built and runtime invariants passed.'
            echo "- Current image size: ${CURRENT_SIZE_BYTES} bytes."
            echo '- Relative size budget is not applicable because the exact `main` base has no Docker image to compare against.'
            echo "- Current PR head: \`${HEAD_SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Docker image size report
        if: steps.baseline.outputs.available == 'true'
        env:
          BASELINE_LABEL: ${{ steps.baseline.outputs.label }}
          BASELINE_SIZE_BYTES: ${{ steps.baseline_image.outputs.size_bytes }}
          CURRENT_SIZE_BYTES: ${{ steps.current_image.outputs.size_bytes }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPORT_JSON: ${{ runner.temp }}/docker-image-size-report.json
          REPORT_MARKDOWN: ${{ runner.temp }}/docker-image-size-report.md
        run: |
          node ./scripts/docker-image-size-report.mjs \
            --baseline-label "$BASELINE_LABEL" \
            --baseline-size-bytes "$BASELINE_SIZE_BYTES" \
            --current-label "pull request (${HEAD_SHA:0:7})" \
            --current-size-bytes "$CURRENT_SIZE_BYTES" \
            --image-label packages/orcel/Dockerfile \
            --output-json "$REPORT_JSON" \
            --output-markdown "$REPORT_MARKDOWN"

      - name: Publish job summary
        if: steps.baseline.outputs.available == 'true'
        env:
          REPORT_MARKDOWN: ${{ runner.temp }}/docker-image-size-report.md
        run: cat "$REPORT_MARKDOWN" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Docker image size report artifact
        if: steps.baseline.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image-size-report
          path: |
            ${{ runner.temp }}/docker-image-size-report.json
            ${{ runner.temp }}/docker-image-size-report.md

      - name: Update pull request comment
        if: steps.baseline.outputs.available == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_MARKDOWN: ${{ runner.temp }}/docker-image-size-report.md
        with:
          script: |
            const fs = require("node:fs");

            const marker = "<!-- orcel-docker-image-size-analysis -->";
            const reportBody = fs.readFileSync(process.env.REPORT_MARKDOWN, "utf8").trim();
            const body = `${marker}\n${reportBody}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: context.issue.number,
              owner: context.repo.owner,
              per_page: 100,
              repo: context.repo.repo,
            });

            const existingComment = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker),
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                body,
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              return;
            }

            await github.rest.issues.createComment({
              body,
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

      - name: Enforce Docker image size budget
        if: steps.baseline.outputs.available == 'true'
        env:
          REPORT_JSON: ${{ runner.temp }}/docker-image-size-report.json
        run: node ./scripts/docker-image-size-budget.mjs --report-json "$REPORT_JSON"
