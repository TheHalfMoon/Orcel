name: Release

# Builds, packages, and qualifies a Windows x64 release and Linux packages from a version tag
# and attaches them to a draft GitHub Release. Publishing the draft is a deliberate maintainer
# action. Binaries are unsigned (no paid code-signing certificate); integrity is enforced by
# manifest verification at install and update, the published SHA256SUMS, and GitHub
# build-provenance attestations, verifiable with `gh attestation verify`.
#
# The build jobs run repository and dependency code (cargo build scripts, proc-macros, npm
# devDependencies) and so hold only `contents: read`: nothing they run can mint an attestation
# or change a release. The publish job runs no repository code at all. It downloads the built
# assets, attests every one of them, and creates or refreshes the draft release, and it runs
# only in the `release` environment, which must require the founder's approval before it starts.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Release build / windows-latest
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Require the tag to match the workspace version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$' | Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne $env:TAG) { throw "tag $env:TAG does not match workspace version $version" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: ./.github/actions/build-package-qualify
        with:
          release-dir: ${{ runner.temp }}/orcel-${{ env.VERSION }}-windows-x64
      - uses: ./.github/actions/reproducibility-check
        with:
          ref: ${{ github.ref }}
          release-dir: ${{ runner.temp }}/orcel-${{ env.VERSION }}-windows-x64
          out-dir: ${{ runner.temp }}/dist
      - name: Collect release assets
        shell: pwsh
        run: |
          $name = "orcel-$env:VERSION-windows-x64"
          $release = Join-Path $env:RUNNER_TEMP $name
          $out = Join-Path $env:RUNNER_TEMP "dist"
          Copy-Item "$release.zip" (Join-Path $out "$name.zip")
          Copy-Item (Join-Path $release "manifest.json") (Join-Path $out "$name.manifest.json")
          Copy-Item (Join-Path $release "THIRD_PARTY_NOTICES.txt") (Join-Path $out "THIRD_PARTY_NOTICES.txt")
          node scripts/generate-sbom.mjs --release $release --out (Join-Path $out "$name.cdx.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/provenance.mjs --release $release --artifact (Join-Path $out "$name.zip") --sbom (Join-Path $out "$name.cdx.json") --reproducibility (Join-Path $out "reproducibility.json") --out (Join-Path $out "$name.provenance.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # LF line endings, so the standard `sha256sum -c` verifies the file.
          $sums = Get-ChildItem $out -File | Where-Object Name -ne "SHA256SUMS.txt" | Sort-Object Name | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          [System.IO.File]::WriteAllText((Join-Path $out "SHA256SUMS.txt"), (($sums -join "`n") + "`n"), [System.Text.Encoding]::ASCII)
          Get-Content (Join-Path $out "SHA256SUMS.txt")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 7

  # XP-17: Linux deb, rpm and per-user tarball. Its assets carry their own SHA256SUMS-linux.txt;
  # the Windows SHA256SUMS.txt is left untouched.
  build-linux:
    name: Release build / ubuntu-latest (Linux packages)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Require the tag to match the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match workspace version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build orceld (release, locked)
        run: cargo build --release --locked -p orceld
      - name: Build the orcel-contain helper (release, locked, its own workspace)
        run: cargo build --release --locked --manifest-path apps/orcel-contain/Cargo.toml --bin orcel-contain
      # #369 item 6, #373 item 5: the XP-10 approval dialog helper ships in
      # the packages; it links GTK 4.
      - name: Build the XP-10 approval helper (release, locked, its own workspace)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev
          cargo build --release --locked --manifest-path apps/orcel-approval-helper-linux/Cargo.toml
      - name: Install the pinned nfpm (checksum-verified)
        run: |
          bash distribution/linux/install-nfpm.sh "$RUNNER_TEMP/nfpm-bin"
          echo "$RUNNER_TEMP/nfpm-bin" >> "$GITHUB_PATH"
      - name: Build the deb, rpm and tarball
        run: |
          bash distribution/linux/package.sh "$VERSION" target/release/orceld apps/orcel-contain/target/release/orcel-contain \
            apps/orcel-approval-helper-linux/target/release/orcel-approval-helper-linux "$RUNNER_TEMP/linux-dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux
          path: |
            ${{ runner.temp }}/linux-dist/*.deb
            ${{ runner.temp }}/linux-dist/*.rpm
            ${{ runner.temp }}/linux-dist/*.tar.gz
            ${{ runner.temp }}/linux-dist/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 7

  # Runs no repository code: no checkout, no build. It needs both builds, waits for the
  # `release` environment's required approval, attests every asset (not only the archives),
  # and creates or refreshes the draft release.
  publish:
    name: Release publish (draft)
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-windows
          path: ${{ runner.temp }}/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-linux
          path: ${{ runner.temp }}/linux
      - name: Verify each build's checksums before attesting
        run: |
          (cd "$RUNNER_TEMP/windows" && sha256sum -c SHA256SUMS.txt)
          (cd "$RUNNER_TEMP/linux" && sha256sum -c SHA256SUMS-linux.txt)
      - name: Attest build provenance for every asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/windows/*
            ${{ runner.temp }}/linux/*
      - name: Create or refresh the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          draft=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$draft" = "false" ]; then
            # Publishing is a deliberate, final maintainer action.
            echo "release $TAG is already published; its assets are not replaced" >&2
            exit 1
          fi
          if [ "$draft" = "true" ]; then
            # A re-run after a partial upload refreshes the draft's assets.
            gh release upload "$TAG" "$RUNNER_TEMP"/windows/* "$RUNNER_TEMP"/linux/* --clobber --repo "$REPO"
          else
            gh release create "$TAG" "$RUNNER_TEMP"/windows/* "$RUNNER_TEMP"/linux/* --draft --verify-tag --repo "$REPO" \
              --title "Orcel $version" \
              --notes "Unsigned Windows x64 build and Linux packages of Orcel $version from $SHA. Verify the assets against SHA256SUMS.txt and SHA256SUMS-linux.txt and with 'gh attestation verify <file> --repo $REPO'; every asset carries a build-provenance attestation, and the installer verifies every payload file against manifest.json. SBOM (CycloneDX 1.5), provenance record, and third-party notices are attached."
          fi
