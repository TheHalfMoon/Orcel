name: Release

# Builds, packages, and qualifies a Windows x64 release from a version tag and
# attaches it to a draft GitHub Release. Publishing the draft is a deliberate
# maintainer action. Binaries are unsigned (no paid code-signing certificate);
# integrity is enforced by manifest verification at install and update, the
# published SHA256SUMS, and a GitHub build-provenance attestation for the
# archive, which is verifiable with `gh attestation verify`.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Release / windows-latest
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Require the tag to match the workspace version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$' | Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match workspace version $version" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: ./.github/actions/build-package-qualify
        with:
          release-dir: ${{ runner.temp }}/orcel-${{ env.VERSION }}-windows-x64
      - uses: ./.github/actions/reproducibility-check
        with:
          ref: ${{ github.ref }}
          release-dir: ${{ runner.temp }}/orcel-${{ env.VERSION }}-windows-x64
          out-dir: ${{ runner.temp }}/dist
      - name: Collect release assets
        shell: pwsh
        run: |
          $name = "orcel-$env:VERSION-windows-x64"
          $release = Join-Path $env:RUNNER_TEMP $name
          $out = Join-Path $env:RUNNER_TEMP "dist"
          Copy-Item "$release.zip" (Join-Path $out "$name.zip")
          Copy-Item (Join-Path $release "manifest.json") (Join-Path $out "$name.manifest.json")
          Copy-Item (Join-Path $release "THIRD_PARTY_NOTICES.txt") (Join-Path $out "THIRD_PARTY_NOTICES.txt")
          node scripts/generate-sbom.mjs --release $release --out (Join-Path $out "$name.cdx.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/provenance.mjs --release $release --artifact (Join-Path $out "$name.zip") --sbom (Join-Path $out "$name.cdx.json") --reproducibility (Join-Path $out "reproducibility.json") --out (Join-Path $out "$name.provenance.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # LF line endings, so the standard `sha256sum -c` verifies the file.
          $sums = Get-ChildItem $out -File | Where-Object Name -ne "SHA256SUMS.txt" | Sort-Object Name | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          [System.IO.File]::WriteAllText((Join-Path $out "SHA256SUMS.txt"), (($sums -join "`n") + "`n"), [System.Text.Encoding]::ASCII)
          Get-Content (Join-Path $out "SHA256SUMS.txt")
      - name: Attest build provenance for the archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/orcel-${{ env.VERSION }}-windows-x64.zip
      - name: Create or refresh the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "dist"
          $files = (Get-ChildItem $out -File).FullName
          $json = gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json isDraft 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists -and -not ($json | ConvertFrom-Json).isDraft) {
            # Publishing is a deliberate, final maintainer action.
            throw "release ${{ github.ref_name }} is already published; its assets are not replaced"
          }
          if ($exists) {
            # A re-run after a partial upload refreshes the draft's assets.
            gh release upload "${{ github.ref_name }}" $files --clobber --repo "${{ github.repository }}"
          } else {
            gh release create "${{ github.ref_name }}" $files --draft --verify-tag --repo "${{ github.repository }}" --title "Orcel $env:VERSION" --notes "Unsigned Windows x64 build of Orcel $env:VERSION from ${{ github.sha }}. Verify the archive against SHA256SUMS.txt and with 'gh attestation verify <archive> --repo ${{ github.repository }}'; the installer verifies every payload file against manifest.json. SBOM (CycloneDX 1.5), provenance record, and third-party notices are attached."
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # XP-17: Linux deb, rpm and per-user tarball, added to the draft release
  # that the Windows job above creates. This job runs only after that job
  # succeeds and never changes it. Its assets carry their own
  # SHA256SUMS-linux.txt and build-provenance attestations; the Windows
  # SHA256SUMS.txt is left untouched.
  release-linux:
    name: Release / ubuntu-latest (Linux packages)
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Require the tag to match the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match workspace version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build orceld (release, locked)
        run: cargo build --release --locked -p orceld
      - name: Build the orcel-contain helper (release, locked, its own workspace)
        run: cargo build --release --locked --manifest-path apps/orcel-contain/Cargo.toml --bin orcel-contain
      - name: Install the pinned nfpm (checksum-verified)
        run: |
          bash distribution/linux/install-nfpm.sh "$RUNNER_TEMP/nfpm-bin"
          echo "$RUNNER_TEMP/nfpm-bin" >> "$GITHUB_PATH"
      - name: Build the deb, rpm and tarball
        run: bash distribution/linux/package.sh "$VERSION" target/release/orceld apps/orcel-contain/target/release/orcel-contain "$RUNNER_TEMP/linux-dist"
      - name: Attest build provenance for the Linux packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/linux-dist/*.deb
            ${{ runner.temp }}/linux-dist/*.rpm
            ${{ runner.temp }}/linux-dist/*.tar.gz
      - name: Add the Linux packages to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)
          if [ "$draft" != "true" ]; then
            # Publishing is a deliberate, final maintainer action.
            echo "release ${{ github.ref_name }} is not a draft; its assets are not replaced" >&2
            exit 1
          fi
          gh release upload "${{ github.ref_name }}" "$RUNNER_TEMP"/linux-dist/* --clobber --repo "${{ github.repository }}"
