name: Release Readiness

on:
  workflow_dispatch:

# Kaf intentionally does not auto-publish from main during the initial migration.
# The upstream release workflow targeted Vercel-owned registries and package
# identities. Publication must stay disabled until Kaf's package namespace,
# first-version policy, and registry ownership are explicitly qualified.

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: package-and-image-dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Dry-run npm package assembly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kaf-package"
          pnpm --filter kaf pack --pack-destination "$RUNNER_TEMP/kaf-package"
          ls -lah "$RUNNER_TEMP/kaf-package"

      - name: Build Kaf sandbox image without publishing
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file packages/kaf/Dockerfile \
            --tag kaf:release-readiness \
            packages/kaf

      - name: Confirm publication boundary
        shell: bash
        run: |
          cat <<'EOF'
          Release readiness completed without publishing.
          No npm package, GitHub Container Registry image, Vercel Container
          Registry image, or GitHub release was created by this workflow.
          EOF
