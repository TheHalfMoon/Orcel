# #438 / #584: repeat Windows native browser tests to catch the rare
# navigation and download timeouts with #587's connection diagnostics, instead
# of waiting for them to recur in ordinary CI. Diagnostic only: it gates
# nothing and changes no product code. It runs on GitHub-hosted runners (no
# cost for this public repository), on a push to a `stress/browser-*` branch
# or by hand.
#
# Each job repeats one pair: a test, then the test that failed right after
# it in CI (libtest runs `--exact` filters in name order, so the pair stays
# adjacent). Pairs from the analysis on #438 (2026-11-03).
name: Browser stress (diagnostic)

on:
  push:
    branches: ["stress/browser-*"]
  workflow_dispatch:
    inputs:
      rounds:
        description: "Repetitions per job"
        default: "15"

permissions:
  contents: read

jobs:
  native:
    name: Pair ${{ matrix.pair.name }} x${{ github.event.inputs.rounds || '15' }} / windows-latest
    strategy:
      fail-fast: false
      matrix:
        pair:
          - name: lan-then-extract
            tests: "a_page_cannot_reach_the_lan_through_webrtc_fetch_or_sockets a_page_is_extracted_as_untrusted_markdown_in_pieces_without_hidden_text"
          - name: silent-then-staged
            tests: "a_silent_worker_times_out_typed_and_is_terminated a_staged_file_never_outlives_a_worker_that_dies_or_hangs a_stalled_cancelled_or_killed_download_is_typed_and_commits_nothing"
          - name: staged-then-stalled
            tests: "a_staged_file_never_outlives_a_worker_that_dies_or_hangs a_stalled_cancelled_or_killed_download_is_typed_and_commits_nothing"
          - name: policy-then-lan
            tests: "a_managed_policy_refuses_before_anything_starts a_page_cannot_reach_the_lan_through_webrtc_fetch_or_sockets"
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build the worker
        run: npm ci --prefix apps/orcel-browser-worker --ignore-scripts && npm --prefix apps/orcel-browser-worker run build
      - name: Build the native tests
        shell: bash
        run: cargo test -p orcel-browser-host --lib --no-run
      - name: Repeat the pair
        shell: bash
        env:
          ROUNDS: ${{ github.event.inputs.rounds || '15' }}
          TESTS: ${{ matrix.pair.tests }}
        run: |
          set -uo pipefail
          export ORCEL_SG108_NODE="$(node -p process.execPath)"
          export ORCEL_SG108_WORKER_MAIN="$PWD/apps/orcel-browser-worker/dist/main.js"
          filters=()
          for name in $TESTS; do filters+=("worker_launch::native_tests::$name"); done
          mkdir -p stress
          failed=0
          for round in $(seq 1 "$ROUNDS"); do
            log="stress/round-$round.log"
            start=$(date +%s)
            cargo test -p orcel-browser-host --lib -- --ignored --exact --test-threads=1 --nocapture "${filters[@]}" >"$log" 2>&1
            status=$?
            echo "STRESS round $round status $status in $(( $(date +%s) - start )) s: $(grep -E '^test result' "$log" | tail -1)"
            if [ "$status" -ne 0 ]; then
              failed=$((failed + 1))
              grep -E ' \.\.\. (ok|FAILED)$|panicked at|SG108-DIAG|^(CONN|TLSOK|TLSERR|HIT|DONE|ABORT)|:443 ' "$log" | head -400
            fi
          done
          echo "STRESS summary: $failed of $ROUNDS rounds failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-stress-${{ matrix.pair.name }}
          path: stress/
          retention-days: 14
