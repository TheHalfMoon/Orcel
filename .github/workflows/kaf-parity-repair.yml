name: Repair Kaf import parity

on:
  push:
    branches:
      - generated/eve-full-import-9c36b7c
    paths:
      - .github/workflows/kaf-parity-repair.yml
      - .kaf-migration/bootstrap.mjs
      - .kaf-migration/repair-parity.mjs
      - .kaf-migration/repair-final-parity.mjs
      - .kaf-migration/audit-identity.mjs
      - scripts/check-template-compatibility.mjs
      - apps/templates/**/package.json
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: kaf-parity-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic identity repairs
        run: |
          node .kaf-migration/repair-parity.mjs
          node .kaf-migration/repair-final-parity.mjs

      - name: Regenerate derived web scaffold
        run: pnpm --filter kaf generate:web-template

      - name: Validate standalone template prepublish policy
        shell: bash
        run: |
          set -euo pipefail
          for template_pkg in \
            apps/templates/kaf-chat-template/package.json \
            apps/templates/kaf-slack-agent-template/package.json \
            apps/templates/personal-agent-template/package.json
          do
            test -f "$template_pkg"
          done
          echo "Standalone template registry lockfiles are not re-resolved before Kaf is published."
          echo "Template compatibility is validated below from the locally packed Kaf tarball."

      - name: Diagnose and apply lint fixes
        id: lint
        shell: bash
        run: |
          set +e
          pnpm lint > "$RUNNER_TEMP/kaf-lint.log" 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo "## Kaf lint diagnostic"
            echo
            echo "Head: \`$(git rev-parse HEAD)\`"
            echo
            echo '```text'
            tail -n 260 "$RUNNER_TEMP/kaf-lint.log"
            echo '```'
          } > "$RUNNER_TEMP/kaf-lint-comment.md"
          exit 0

      - name: Post lint diagnostic to PR
        if: steps.lint.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh pr comment 1 --body-file "$RUNNER_TEMP/kaf-lint-comment.md"

      - name: Audit Kaf project identity
        run: node .kaf-migration/audit-identity.mjs

      - name: Rebaseline unpublished current contract metadata for Kaf
        shell: bash
        run: |
          set -euo pipefail
          node .kaf-migration/rebaseline-extension-contracts.mjs
          pnpm update:extension-contracts

      - name: Verify invariant guard
        run: pnpm guard:invariants

      - name: Build Kaf distribution for framework fixtures
        run: pnpm --filter kaf run build

      - name: Verify framework fixtures
        run: pnpm test:framework-fixtures

      - name: Verify authorization integration regression
        run: pnpm --filter kaf exec vitest run --config vitest.integration.config.ts src/execution/tool-auth.integration.test.ts

      - name: Diagnose template compatibility
        id: templates
        shell: bash
        run: |
          set +e
          pnpm check:templates > "$RUNNER_TEMP/kaf-template-compatibility.log" 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo "## Kaf template compatibility diagnostic"
            echo
            echo "Head: \`$(git rev-parse HEAD)\`"
            echo
            echo '```text'
            tail -n 260 "$RUNNER_TEMP/kaf-template-compatibility.log"
            echo '```'
          } > "$RUNNER_TEMP/kaf-template-comment.md"
          exit 0

      - name: Post template diagnostic to PR
        if: steps.templates.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh pr comment 1 --body-file "$RUNNER_TEMP/kaf-template-comment.md"

      - name: Diagnose unit tests
        id: unit
        shell: bash
        run: |
          set +e
          pnpm test:unit > "$RUNNER_TEMP/kaf-unit.log" 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo "## Kaf unit-test diagnostic"
            echo
            echo "Head: \`$(git rev-parse HEAD)\`"
            echo
            echo '```text'
            tail -n 400 "$RUNNER_TEMP/kaf-unit.log"
            echo '```'
          } > "$RUNNER_TEMP/kaf-unit-comment.md"
          exit 0

      - name: Post unit-test diagnostic to PR
        if: steps.unit.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh pr comment 1 --body-file "$RUNNER_TEMP/kaf-unit-comment.md"

      - name: Verify patch integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Record deterministic repair commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes were produced."
            exit 0
          fi
          git commit --no-verify -m "fix: apply deterministic Kaf parity repairs"
          echo "REPAIR_COMMIT=$(git rev-parse HEAD)"
          echo "REPAIR_TREE=$(git rev-parse HEAD^{tree})"

      - name: Push repair to PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet "origin/${GITHUB_REF_NAME}...HEAD"; then
            echo "No new repair commit to push."
            exit 0
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Enforce parity diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.lint.outputs.status }}" = "0"
          test "${{ steps.templates.outputs.status }}" = "0"
          test "${{ steps.unit.outputs.status }}" = "0"
