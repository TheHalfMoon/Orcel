name: Scoped package assertion repair

on:
  push:
    branches:
      - fix/npm-scoped-core-package
    paths:
      - .github/workflows/scoped-package-repair.yml
      - packages/orcel/src/setup/scaffold/index.integration.test.ts

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply exact scoped-package assertion repairs
        shell: python
        run: |
          from pathlib import Path

          path = Path("packages/orcel/src/setup/scaffold/index.integration.test.ts")
          text = path.read_text(encoding="utf-8")
          replacements = [
              ('dependencies: expect.arrayContaining(["orcel", "next", "react", "react-dom"]),',
               'dependencies: expect.arrayContaining(["@orcel/orcel", "next", "react", "react-dom"]),', 1),
              ('\'"orcel": "latest"\'', '\'"@orcel/orcel": "latest"\'', 2),
              ('peerDependencies?: { orcel?: string };', 'peerDependencies?: Record<string, string>;', 1),
              ('expect(packageJson.devDependencies?.orcel).toBe("0.25.0");',
               'expect(packageJson.devDependencies?.["@orcel/orcel"]).toBe("0.25.0");', 1),
              ('\'"orcel": "^0.25.0"\'', '\'"@orcel/orcel": "^0.25.0"\'', 2),
              ('["node", "orcel/workflow-modules"]', '["node", "@orcel/orcel/workflow-modules"]', 1),
          ]
          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"Expected {expected} occurrences of {old!r}, found {actual}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")

      - name: Verify stale package assertions are absent
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'dependencies: expect.arrayContaining(["orcel"' packages/orcel/src/setup/scaffold/index.integration.test.ts
          ! grep -F '\"orcel\": \"latest\"' packages/orcel/src/setup/scaffold/index.integration.test.ts
          ! grep -F '\"orcel\": \"^0.25.0\"' packages/orcel/src/setup/scaffold/index.integration.test.ts
          ! grep -F 'orcel/workflow-modules' packages/orcel/src/setup/scaffold/index.integration.test.ts
          ! grep -F 'devDependencies?.orcel' packages/orcel/src/setup/scaffold/index.integration.test.ts

      - name: Commit assertion repairs
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- packages/orcel/src/setup/scaffold/index.integration.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/orcel/src/setup/scaffold/index.integration.test.ts
          git commit -m "test: align scoped Orcel scaffold assertions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
