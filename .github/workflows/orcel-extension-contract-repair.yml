name: Orcel Extension Contract Repair

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: orcel-extension-contract-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate current contract reports
        run: pnpm update:extension-contracts

      - name: Prove initial-import repair scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for file in "${changed[@]}"; do
            case "$file" in
              packages/orcel/extension-contracts/reports/*) ;;
              *)
                echo "Unexpected contract regeneration path: $file" >&2
                exit 1
                ;;
            esac
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Re-run invariant guard
        run: pnpm guard:invariants

      - name: Commit regenerated initial-import reports
        if: steps.scope.outputs.changed == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/orcel/extension-contracts/reports
          git commit -m "fix: regenerate Orcel extension contract reports"
          git push origin "HEAD:${HEAD_REF}"
