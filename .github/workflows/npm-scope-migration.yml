name: Npm Scope Migration

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  migrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/npm-scoped-core-package'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect completed migration
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if jq -e '.name == "@orcel/orcel"' packages/orcel/package.json >/dev/null; then
            echo "complete=true" >>"$GITHUB_OUTPUT"
            echo "The npm-scope migration is already present on this head; no write will occur."
          else
            echo "complete=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.gate.outputs.complete != 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        if: steps.gate.outputs.complete != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Apply bounded package-identity migration
        if: steps.gate.outputs.complete != 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = (
              "apps/templates/orcel-chat-template/package.json",
              "apps/templates/orcel-llm-council-template/package.json",
              "apps/templates/orcel-slack-agent-template/package.json",
              "apps/templates/personal-agent-template/package.json",
              "e2e/fixtures/gadget-extension/package.json",
              "e2e/fixtures/gizmo-extension/package.json",
              "e2e/fixtures/js-only-extension/package.json",
              "e2e/fixtures/toolkit-extension/package.json",
          )
          fields = ("dependencies", "devDependencies", "peerDependencies", "optionalDependencies")
          for rel in files:
              path = Path(rel)
              payload = json.loads(path.read_text(encoding="utf-8"))
              found = False
              for field in fields:
                  deps = payload.get(field)
                  if not isinstance(deps, dict) or "orcel" not in deps:
                      continue
                  value = deps["orcel"]
                  if "@orcel/orcel" in deps:
                      raise SystemExit(f"{rel}:{field} contains both old and new package keys")
                  marker = f'"orcel": {json.dumps(value)}'
                  replacement = f'"@orcel/orcel": {json.dumps(value)}'
                  text = path.read_text(encoding="utf-8")
                  if marker not in text:
                      raise SystemExit(f"{rel}:{field} dependency marker was not found exactly")
                  path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
                  found = True
              if not found:
                  raise SystemExit(f"{rel} did not contain the expected Orcel dependency key")
          PY
          python3 .github/scripts/migrate-orcel-npm-scope.py

      - name: Regenerate and freeze lockfile
        if: steps.gate.outputs.complete != 'true'
        run: |
          set -euo pipefail
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile

      - name: Audit migration diff
        if: steps.gate.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          python3 - <<'PY'
          import re
          import subprocess

          diff = subprocess.check_output(["git", "diff", "-U0"], text=True)
          route = re.compile(r"[\"']/orcel/")
          violations = [
              line
              for line in diff.splitlines()
              if line.startswith("-") and not line.startswith("---") and route.search(line)
          ]
          if violations:
              print("A public /orcel route deletion was detected; refusing to continue.")
              for line in violations[:50]:
                  print(line)
              raise SystemExit(1)
          print("PUBLIC_ROUTE_DIFF_AUDIT=PASS")
          PY

          if git grep -n '@orcel/orcel/orcel' -- ':!*.lock'; then
            echo "Duplicated scoped package path detected." >&2
            exit 1
          fi

          echo "Changed files: $(git diff --name-only | wc -l | tr -d ' ')"
          git diff --shortstat
          git diff -- packages/orcel/package.json \
            packages/orcel-buzz-acp-adapter/package.json \
            scripts/assert-changeset-publish-packages.mjs \
            packages/orcel/src/internal/package-name.ts

      - name: Build publishable packages
        if: steps.gate.outputs.complete != 'true'
        run: |
          set -euo pipefail
          pnpm --filter '@orcel/orcel' build
          pnpm --filter '@orcel/buzz-acp-adapter' build

      - name: Dry-run npm publication
        if: steps.gate.outputs.complete != 'true'
        run: |
          set -euo pipefail
          pnpm --dir packages/orcel publish --dry-run --no-git-checks --access public
          pnpm --dir packages/orcel-buzz-acp-adapter publish --dry-run --no-git-checks --access public

      - name: Commit qualified migration
        if: steps.gate.outputs.complete != 'true'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: publish Orcel from the @orcel scope"
          git push origin "HEAD:${HEAD_REF}"
