name: E2E Tests (Local)

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: e2e-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The e2e matrix jobs are required status checks, so they must report on
  # every PR. An `on.pull_request.paths` filter would leave them permanently
  # "expected" on PRs that don't touch e2e-relevant paths, blocking merge.
  # Instead the workflow always triggers, this job decides relevance, and the
  # matrix jobs skip when nothing relevant changed — skipped required checks
  # count as satisfied.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check changed paths
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the PR merge commit; HEAD^1 is the base branch tip, so
          # this diff is exactly the PR's changed files.
          # PRs confined to packages/orcel-code or packages/orcel-computer-use (lockfile included) never
          # exercise the framework e2e fixtures; skip the whole matrix for them.
          if ! git diff --name-only HEAD^1 HEAD | grep -qvE '^(packages/orcel-(code|computer-use)/|pnpm-lock\.yaml$)'; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(packages/orcel/|apps/fixtures/|e2e/|pnpm-workspace\.yaml$|pnpm-lock\.yaml$|\.github/workflows/e2e-local\.yml$|\.github/scripts/discover-e2e-fixtures\.mjs$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  discover-fixtures:
    name: discover-fixtures
    runs-on: ubuntu-latest
    outputs:
      model_matrix: ${{ steps.discover.outputs.model_matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Discover eval fixtures
        id: discover
        run: node .github/scripts/discover-e2e-fixtures.mjs

  model-e2e-policy:
    name: model-e2e-policy
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.policy.outputs.run }}
      reason: ${{ steps.policy.outputs.reason }}
    steps:
      - name: Enforce zero-cost model E2E policy
        id: policy
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=zero-cost-pr" >> "$GITHUB_OUTPUT"
            echo "Real-model E2E is manual-only under Orcel zero-cost qualification."
            exit 0
          fi
          if [ -z "${AI_GATEWAY_API_KEY:-}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing-ai-gateway-credential" >> "$GITHUB_OUTPUT"
            echo "AI_GATEWAY_API_KEY is required for a manual real-model E2E run." >&2
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "reason=manual-with-credential" >> "$GITHUB_OUTPUT"

  # The model suite: every fixture runs here against the local world with
  # real matrix models. Model-sensitive fixtures (`"e2e": { "modelMatrix":
  # "full" }` in package.json) run on every matrix model; the rest run once
  # on the default model. The world suites (e2e-vercel, e2e-postgres) cover
  # the other workflow worlds with deterministic mock models.
  e2e:
    name: e2e-local (${{ matrix.name }}, ${{ matrix.model_name }})${{ matrix.shard && format(' [{0}]', matrix.shard) || '' }}
    runs-on: ubuntu-latest
    needs: [changes, discover-fixtures, model-e2e-policy]
    if: needs.changes.outputs.relevant == 'true' && needs.model-e2e-policy.outputs.run == 'true'
    continue-on-error: ${{ matrix.optional }}
    # Pull requests intentionally skip real-model execution. Manual dispatch
    # requires an explicit gateway credential before this matrix can expand.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-fixtures.outputs.model_matrix) }}

    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      ORCEL_E2E_MODEL: ${{ matrix.model_id }}
      ORCEL_EVAL_IDS_JSON: ${{ toJSON(matrix.eval_ids) }}
      ORCEL_EVAL_JUNIT_DIR: ${{ github.workspace }}/.junit
      ORCEL_SANDBOX_IMAGE_TAG: latest

    steps:
      - name: Checkout code
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        if: needs.changes.outputs.relevant == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        if: needs.changes.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install microsandbox runtime
        if: needs.changes.outputs.relevant == 'true' && matrix.name == 'agent-microsandbox-dockerfile'
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          docker info
          pnpm --filter agent-microsandbox-dockerfile exec node --input-type=module -e \
            'import { setup } from "microsandbox"; await setup().install();'

      - name: Build orcel package
        if: needs.changes.outputs.relevant == 'true'
        # Full build, not build:js: the deployed/runtime bundles must carry the
        # stamped package version (scripts/stamp-version-tokens.mjs) and docs.
        run: pnpm --filter orcel run build

      - name: Build extension fixtures
        if: needs.changes.outputs.relevant == 'true'
        # Extension fixtures ship no committed `dist/`; produce it here so
        # consuming fixtures resolve the built artifacts. `--if-present` skips
        # extension fixtures without a build script. The update re-packs the
        # `file:`-protocol store copies so they pick up the fresh dist —
        # a plain reinstall short-circuits and leaves them stale.
        run: |
          pnpm --filter "./e2e/fixtures/*-extension" run --if-present build
          pnpm --filter dist-extensions update gizmo-extension gadget-extension

      - name: Stage workspace extension fixtures as dist-only
        if: needs.changes.outputs.relevant == 'true'
        # Removing author source proves the workspace consumer discovers and
        # compiles the same agent-shaped dist trees we publish. Toolkit covers
        # the rich TypeScript surface; js-only covers pure JavaScript authoring.
        run: |
          mv e2e/fixtures/toolkit-extension/extension "$RUNNER_TEMP/toolkit-extension-source"
          mv e2e/fixtures/js-only-extension/extension "$RUNNER_TEMP/js-only-extension-source"

      - name: Run fixture evals
        if: needs.changes.outputs.relevant == 'true'
        run: |
          mkdir -p "$ORCEL_EVAL_JUNIT_DIR"
          cd "${{ matrix.dir }}"
          pnpm run --if-present e2e:prepare
          mapfile -d '' -t eval_ids < <(node -e 'for (const id of JSON.parse(process.env.ORCEL_EVAL_IDS_JSON || "null") || []) process.stdout.write(`${id}\0`)')
          shard_suffix="${{ matrix.shard || '' }}"
          junit_suffix="${shard_suffix:+-$shard_suffix}"
          pnpm exec orcel eval "${eval_ids[@]}" --strict --verbose \
            --junit "$ORCEL_EVAL_JUNIT_DIR/${{ matrix.name }}-${{ matrix.model_name }}${junit_suffix}.xml"

      - name: Capture failed workflow event ordering
        if: failure() && needs.changes.outputs.relevant == 'true'
        run: node .github/scripts/capture-workflow-events.mjs "${{ matrix.dir }}" .artifacts

      - name: Upload eval artifacts
        if: (failure()) && needs.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-artifacts-${{ matrix.name }}-${{ matrix.model_name }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: |
            .junit
            .artifacts/workflow-events.json
            e2e/fixtures/*/.orcel/evals
            apps/fixtures/*/.orcel/evals
            ${{ matrix.dir }}/.orcel/traces
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  e2e-required:
    name: e2e-local
    runs-on: ubuntu-latest
    needs: [changes, discover-fixtures, model-e2e-policy, e2e]
    if: always()
    steps:
      - name: Require successful e2e matrix or explicit zero-cost skip
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DISCOVERY_RESULT: ${{ needs.discover-fixtures.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          POLICY_RESULT: ${{ needs.model-e2e-policy.result }}
          RUN_E2E: ${{ needs.model-e2e-policy.outputs.run }}
          POLICY_REASON: ${{ needs.model-e2e-policy.outputs.reason }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Changed-path classification failed: $CHANGES_RESULT"
            exit 1
          fi
          if [ "$DISCOVERY_RESULT" != "success" ]; then
            echo "Fixture discovery failed: $DISCOVERY_RESULT"
            exit 1
          fi
          if [ "$POLICY_RESULT" != "success" ]; then
            echo "Model E2E policy failed: $POLICY_RESULT"
            exit 1
          fi
          if [ "$RELEVANT" != "true" ]; then
            echo "Model E2E not relevant to this change."
            exit 0
          fi
          if [ "$RUN_E2E" != "true" ]; then
            echo "Real-model E2E intentionally skipped: $POLICY_REASON"
            exit 0
          fi
          if [ "$E2E_RESULT" != "success" ]; then
            echo "E2E matrix result: $E2E_RESULT"
            exit 1
          fi
