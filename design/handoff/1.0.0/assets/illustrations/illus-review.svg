  </filter>
</defs><g filter="url(#paint)"><rect x="80" y="60" width="240" height="280" fill="#BFD8F7"/><path d="M30 200c80-110 260-110 340 0-80 110-260 110-340 0Z" fill="#2354D4"/><circle cx="200" cy="200" r="62" fill="#F7F3EB"/><circle cx="200" cy="200" r="34" fill="#DB2532"/></g></svg>
