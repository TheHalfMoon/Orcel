[package]
name = "orcel-lifecycle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "orcel"
path = "src/main.rs"

[[bin]]
name = "orcel-mcp-host"
path = "src/mcp_host_main.rs"

[dependencies]
orcel-approval = { path = "../orcel-approval" }
orcel-platform = { path = "../orcel-platform" }
orcel-policy = { path = "../orcel-policy" }
orcel-tunnel = { path = "../orcel-tunnel" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
orcel-contracts = { path = "../orcel-contracts" }
