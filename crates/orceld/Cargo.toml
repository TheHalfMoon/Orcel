[package]
name = "orceld"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autobins = false

[[bin]]
name = "orceld"
path = "src/sg000039_main.rs"

[features]
# SG-000108 product caller slice 1b: orceld drives the live browser host in
# worker mode under the approval broker. Test builds only; the release
# build never enables it.
live-browser-test = ["dep:orcel-browser-host", "orcel-browser-host/live-browser-test"]
# SG-000108 slice 3c (decision 7): the live browser shapes reach a real
# host only in development builds, which run the worker runtime the
# host build pinned. Never default; the release-blocker sweep keeps it out
# of every release build.
live-browser-dev = ["dep:orcel-browser-host", "orcel-browser-host/live-browser-dev"]
# Orcel Browser B1: the live browser asks the human-intervention gate
# (orcel-browser-session) before each agent action. Off by default, and no
# build enables it, until SG-000135 defines the browser session broker it
# belongs to. The gate can only refuse; it grants nothing.
browser-takeover-gate = []
# SG-000135 OB-01 end-to-end harness (scripts/browser-full-e2e.mjs), TEST
# BUILDS ONLY: together with both live browser features above, orceld's SOFT
# consent is decided by a scripted decider (the approval crate's existing
# test-support soft decider) that approves only the mission's four browser
# actions whose whole target is the loopback fixture origin, and records
# each prompt's dialog text.
# orceld refuses to start without ORCEL_E2E_CONSENT_LOG. SG-000132 slice 2: in
# this build only, the Full Access lease source talks to the harness's
# authority console (ORCEL_E2E_AUTHORITY) instead of the installed service.
# Never default, never
# in a development or release build; the release-blocker sweep confines it.
browser-full-scripted-consent = ["orcel-approval/test-support"]


[dependencies]
orcel-approval = { path = "../orcel-approval" }
orcel-browser-host = { path = "../orcel-browser-host", optional = true }
orcel-browser-session = { path = "../orcel-browser-session" }
orcel-audit = { path = "../orcel-audit" }
# SG-000132 slice 1: the authority service client (verify, Authorize).
orcel-authority = { path = "../orcel-authority" }
orcel-contracts = { path = "../orcel-contracts" }
orcel-platform = { path = "../orcel-platform" }
orcel-policy = { path = "../orcel-policy" }
orcel-provider-browser = { path = "../orcel-provider-browser" }
orcel-provider-clipboard = { path = "../orcel-provider-clipboard" }
orcel-provider-fs = { path = "../orcel-provider-fs" }
orcel-provider-git = { path = "../orcel-provider-git" }
orcel-provider-network = { path = "../orcel-provider-network" }
orcel-provider-process = { path = "../orcel-provider-process" }
orcel-provider-uia = { path = "../orcel-provider-uia" }
fs4.workspace = true
orcel-journal = { path = "../orcel-journal" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
# #398: poll(2) for the app API accept loop and utimensat(2) to keep its
# socket and lock file from runtime-directory clean-up. Already in the graph
# through orcel-platform (same version).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# CR-01 adds the named-pipe app API: Security (token user, SID, DACL from
# SDDL), Storage_FileSystem (pipe open flags, ReadFile/WriteFile), System_IO
# (overlapped I/O with timeouts) and System_Pipes. Same crate and version.
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  # SG-000135 OB-06, read-only (human_input.rs): GetLastInputInfo,
  # GetTickCount, GetForegroundWindow, GetWindowThreadProcessId and
  # IsProcessInJob. tests/ob04_shadow_scan.rs keeps every input, focus,
  # foreground and clipboard mutation out of all of orceld's sources.
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# XP-19 secret storage. Windows uses DPAPI through windows-sys above
# (Win32_Security_Cryptography, already in the graph through orcel-policy).
# macOS and Linux WRAP the `keyring` project's per-OS stores, the crate
# family Cua's cua-auth uses (T-CUA-34, REFERENCE): MIT OR Apache-2.0.
[target.'cfg(target_os = "macos")'.dependencies]
keyring-core = "1.0.0"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
security-framework = "3.7"

[target.'cfg(target_os = "linux")'.dependencies]
keyring-core = "1.0.0"
zbus-secret-service-keyring-store = { version = "1.0.0", features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
orcel-approval = { path = "../orcel-approval", features = ["test-support"] }
