[package]
name = "orcel-authority"
description = "SG-000132 Orcel authority service: lease signing, epoch, revocation, grant window and audit, held outside the user session (Windows)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autobins = false

[[bin]]
name = "orcel-authority"
path = "src/bin/orcel-authority.rs"

[features]
# SG-000132 slice 2, TEST BUILDS ONLY: the scripted E2E harness
# (scripts/browser-full-e2e.mjs) runs `orcel-authority --console
# --e2e-scripted-consent <log>`, which stands in for the service-observed
# unlock, the confirmation (answered Yes, logged) and the Windows Hello
# signature. Never default, never in a development or release build; the
# release-blocker sweep confines it.
authority-scripted-consent = []

[dependencies]
orcel-contracts = { path = "../orcel-contracts" }
orcel-platform = { path = "../orcel-platform" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# Spec section 7: windows-sys 0.52 only (no new crate). Services,
# EventLog and RemoteDesktop are the features the spec names for this
# packet; UI_WindowsAndMessaging carries the WTSSendMessageW message box
# styles and the WTS_SESSION_* codes; Cryptography carries CNG (ECDSA P-256
# lease signatures, RSA PKCS#1 Windows Hello signature checks) and DPAPI.
# The native installer (install hardening) adds LibraryLoader (System32-only
# DLL search), SystemInformation (the Windows folder) and UI_Shell (known
# folder IDs; shell32, ole32 and userenv are loaded from System32 at run time).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_EventLog",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Services",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
