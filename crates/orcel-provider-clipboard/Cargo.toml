[package]
name = "orcel-provider-clipboard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
orcel-contracts = { path = "../orcel-contracts" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }

# XP-15: text-only clipboard on macOS (NSPasteboard) and Linux (X11, and
# Wayland through the data-control protocols). Image support is off; the
# provider never moves anything but Unicode text. arboard reports through
# the `log` facade and never writes to stdout, which carries orceld's
# JSON protocol. wl-clipboard-rs is named directly only to probe for the
# data-control protocol before arboard is asked for a Wayland clipboard.
[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "=3.6.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
wl-clipboard-rs = "=0.9.4"

# XP-15: runs without the libtest harness so the observed process owns
# its stdout; see the file header.
[[test]]
name = "xp15_clipboard_ownership"
harness = false
