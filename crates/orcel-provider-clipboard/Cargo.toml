[package]
name = "orcel-provider-clipboard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
orcel-contracts = { path = "../orcel-contracts" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }

# XP-15: text-only clipboard on macOS (NSPasteboard) and Linux (X11, and
# Wayland through the data-control protocols). Image support is off; the
# provider never moves anything but Unicode text.
[target.'cfg(target_os = "macos")'.dependencies]
clipboard-rs = { version = "=0.3.5", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
clipboard-rs = { version = "=0.3.5", default-features = false, features = ["wayland"] }
