[package]
name = "orcel-provider-clipboard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
orcel-contracts = { path = "../orcel-contracts" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }

# XP-15: text-only clipboard on macOS (NSPasteboard) and Linux (X11, and
# Wayland through the data-control protocols). Image support is off; the
# provider never moves anything but Unicode text. arboard reports through
# the `log` facade and never writes to stdout, which carries orceld's
# JSON protocol. On Linux, reads use wl-clipboard-rs (Wayland) and x11rb
# (X11) directly with a hard deadline and size cap (libc for poll), and
# Wayland writes use wl-clipboard-rs; arboard serves X11 writes.
[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "=3.6.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "=3.6.1", default-features = false }
wl-clipboard-rs = "=0.9.4"
x11rb = "=0.13.2"
libc = "0.2"

# XP-15: runs without the libtest harness so the observed process owns
# its stdout; see the file header.
[[test]]
name = "xp15_clipboard_ownership"
harness = false
