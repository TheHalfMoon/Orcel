[package]
name = "orcel-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/sg000040.rs"

[dependencies]
orcel-approval = { path = "../orcel-approval" }
orcel-contracts = { path = "../orcel-contracts" }
orcel-platform = { path = "../orcel-platform" }
orcel-provider-browser = { path = "../orcel-provider-browser" }
orcel-provider-clipboard = { path = "../orcel-provider-clipboard" }
orcel-provider-network = { path = "../orcel-provider-network" }
orcel-provider-uia = { path = "../orcel-provider-uia" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_System_Threading",
] }
