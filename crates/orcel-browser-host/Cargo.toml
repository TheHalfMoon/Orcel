[package]
name = "orcel-browser-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "orcel-browser-host"
path = "src/main.rs"

[features]
# SG-000108 product caller slices 1-2: the host binary's worker mode, with
# the loopback fixture origin and its certificate admitted. Test builds
# only. The release-blocker sweep keeps it out of every other manifest and
# feature list; no release build compiles this crate with it.
live-browser-test = []
# SG-000108 slice 3b-ii (decision 7): the host binary's worker mode for
# public HTTPS destinations, running only the worker runtime the build
# pinned (scripts/dev-pin.mjs). Development builds only: never default, never
# enabled by another feature, and kept out of every release build by the
# release-blocker sweep.
live-browser-dev = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Kernel",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
] }
